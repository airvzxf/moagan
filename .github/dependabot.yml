# Dependabot — moagan
#
# Two ecosystems: github-actions (the actions referenced from
# .github/workflows/*.yml + the .github/actions/rust-setup composite)
# and cargo (runtime + dev dependencies in Cargo.lock).
#
# The `groups` layout for `github-actions` is per-action-major, so
# every Dependabot PR touches one action family. This mirrors the
# structure in airvzxf/ftp-deployment-action's
# `.github/dependabot.yml`, where each bumping action gets its own
# PR (and the catch-all `actions-others` group is excluded from each
# named group to keep the surface of a single review small). The
# `actions-cache-artifact` group keeps `actions/cache`,
# `actions/upload-artifact`, and `actions/download-artifact` together
# because they release as a coordinated triplet (e.g. the Node 24
# bump landed on all three within ~3 weeks of each other).
#
# Conventions match the host AGENTS.md (GPG-signed, conventional
# commits) and the repo's existing release flow:
#   - github-actions bumps land as `ci(deps): bump the <group> group ...`
#   - cargo bumps land as `chore(deps): bump the <group> group ...`
#     (`include: scope` adds `(deps)`; the type must be one that
#     scripts/check-commit-msg.sh accepts)
#   - every PR lands with labels `dependencies` + the ecosystem tag
#   - `open-pull-requests-limit` caps concurrent PRs so we never drown
#
# Validity: GitHub rejects the WHOLE file when one option is invalid,
# and then no ecosystem gets updates. That happened from 2026-08 to
# 2026-11: the cargo groups used `dependency-type` (not supported for
# cargo, and `indirect` is not a valid group value anywhere) and an
# empty `exclude-patterns`, github-actions set `versioning-strategy`,
# and both set `commit-message.prefix-development` (neither option is
# supported for these ecosystems), so Dependabot never opened a single
# PR. Check every option, and its "Supported by" line, against
# https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference
# and validate with the SchemaStore schema before pushing:
#   check-jsonschema --schemafile https://json.schemastore.org/dependabot-2.0.json .github/dependabot.yml
#
# Defense-in-depth: the cargo `ignore` block lists the no-go crates
# from /AGENTS.md. They are not in Cargo.lock today, but if a
# transitive advisory ever pulled one in, Dependabot would not be
# able to upgrade it on its own (forcing a human PR + AGENTS.md
# review). The CI guard `make guard-deps` is the authoritative
# source of truth; this list is a backstop.
#
# Reference for the per-action-major grouping + the `exclude-patterns`
# catch-all style: airvzxf/ftp-deployment-action `.github/dependabot.yml`.

version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    # No `versioning-strategy`: github-actions does not support it.
    # Major bumps (e.g. a Node runtime move) arrive as their own PRs.
    labels:
      - "dependencies"
      - "ci"
      - "area:ci"
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      actions-checkout:
        patterns: ["actions/checkout"]
      actions-cache-artifact:
        # Keep these three together — they release as a coordinated
        # triplet (Node 24 bumps land on all three within ~3 weeks).
        patterns:
          - "actions/cache"
          - "actions/upload-artifact"
          - "actions/download-artifact"
      actions-codeql:
        patterns:
          - "github/codeql-action"
      actions-rust:
        patterns:
          - "dtolnay/rust-toolchain"
          - "Swatinem/rust-cache"
      # Split out so `taiki-e/install-action` (composite, bash-only,
      # no Node runtime) does not stall the dtolnay/Swatinem batch
      # when only its upstream has a fresh bump.
      actions-rust-toolchain-only:
        patterns:
          - "taiki-e/install-action"
      actions-release:
        patterns:
          - "softprops/action-gh-release"
      # Both `init` and `analyze` sub-actions live under
      # `github/codeql-action`; the catch-all below excludes it.
      actions-others:
        patterns: ["*"]
        exclude-patterns:
          - "actions/checkout"
          - "actions/cache"
          - "actions/upload-artifact"
          - "actions/download-artifact"
          - "github/codeql-action"
          - "dtolnay/rust-toolchain"
          - "Swatinem/rust-cache"
          - "taiki-e/install-action"
          - "softprops/action-gh-release"
          - "anchore/sbom-action"

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "rust"
      - "area:build"
    commit-message:
      prefix: "chore"
      include: "scope"
    # Never let Dependabot silently bump a crate that violates AGENTS.md.
    # The CI guard `make guard-deps` is the authoritative source of truth,
    # but we also short-circuit Dependabot updates for these names.
    ignore:
      - dependency-name: "anthropic-*"
      - dependency-name: "claude-*"
      - dependency-name: "secrecy"
      - dependency-name: "axum"
      - dependency-name: "hyper"
      - dependency-name: "sqlx"
      - dependency-name: "governor"
      - dependency-name: "figment"
      - dependency-name: "refinery"
      - dependency-name: "askama"
      - dependency-name: "handlebars"
      - dependency-name: "lettre"
      - dependency-name: "inquire"
      - dependency-name: "time"
    # `allow: all` adds the transitive crates of Cargo.lock to the
    # weekly run (cargo version updates cover direct dependencies
    # only by default), so lockfile-only patch releases such as the
    # zstd / rustls-webpki fixes land without waiting for an advisory.
    allow:
      - dependency-type: "all"
    # Cargo groups cannot filter by `dependency-type` (that option is
    # for bundler/composer/mix/maven/npm/pip), so they split by semver
    # level: one weekly PR with every minor and patch bump, and one PR
    # per major bump so a breaking change is reviewed on its own.
    # Security updates are not grouped: one PR per advisory.
    groups:
      rust-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types:
          - "minor"
          - "patch"
