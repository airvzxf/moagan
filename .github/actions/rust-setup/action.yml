name: 'rust-setup'
description: 'Install pinned Rust toolchain + restore the cargo dependency cache (Swatinem/rust-cache@v2). Only main saves, and only the step that passes save-cache: true (ADR-0014). The calling workflow MUST `actions/checkout@v4` first — local composite actions live in the repo and are not resolvable before checkout.'

inputs:
  components:
    description: 'Extra rustup components to install (e.g. "rustfmt,clippy")'
    required: false
    default: ''
  shared-key:
    description: 'rust-cache shared key. `moagan-dev` for dev/test-profile builds, `moagan-release` for `cargo build --release`. Required by scripts/check-ci-cache-policy.sh (R3).'
    required: true
  save-cache:
    description: 'Set to `true` on the single step that writes this shared key (scripts/check-ci-cache-policy.sh R4). Every other step only restores. Ignored outside refs/heads/main.'
    required: false
    default: 'false'

outputs:
  cache-hit:
    description: 'true when the restored entry matched the exact key (same toolchain, environment and Cargo.lock/Cargo.toml).'
    value: ${{ steps.cache.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
      with:
        toolchain: 1.97.1
        components: ${{ inputs.components }}

    - name: Cache cargo registry, git index, and dependency builds
      id: cache
      uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
      with:
        # One key per build profile. The entry holds the registry and
        # the compiled dependencies only; the moagan crate itself is
        # rebuilt every run (it changes with every commit while the key
        # changes only with Cargo.lock, Cargo.toml or the toolchain).
        shared-key: ${{ inputs.shared-key }}
        # Only main writes, and only the designated step. A pull request
        # or a tag restores main's entry (GitHub lets every ref read the
        # default branch's caches) and never creates one of its own, so
        # no `refs/pull/N/merge` entry is ever left behind (ADR-0014).
        save-if: ${{ inputs.save-cache == 'true' && github.ref == 'refs/heads/main' }}
        # A failed build must not save a partial entry under the exact
        # key: an exact hit is never saved again, so it would stay
        # partial until Cargo.lock changes.
        cache-on-failure: false
