name: 'rust-setup'
description: 'Install pinned Rust toolchain + restore cargo cache (Swatinem/rust-cache@v2). The calling workflow MUST `actions/checkout@v4` first — local composite actions live in the repo and are not resolvable before checkout.'

inputs:
  components:
    description: 'Extra rustup components to install (e.g. "rustfmt,clippy")'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      with:
        toolchain: 1.97.1
        components: ${{ inputs.components }}

    - name: Cache cargo registry, git index, and target/
      uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      with:
        cache-on-failure: true
        # Single-crate project, so default workspace detection is fine.
        # cache-on-failure: true keeps the cache around even if a job failed
        # mid-build, so the next push doesn't have to re-download the
        # registry from scratch.