name: 'rust-setup'
description: 'Checkout + install pinned Rust toolchain + restore cargo cache (Swatinem/rust-cache@v2).'

inputs:
  components:
    description: 'Extra rustup components to install (e.g. "rustfmt,clippy")'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 1.97.1
        components: ${{ inputs.components }}

    - name: Cache cargo registry, git index, and target/
      uses: Swatinem/rust-cache@v2
      with:
        cache-on-failure: true
        # Single-crate project, so default workspace detection is fine.
        # cache-on-failure: true keeps the cache around even if a job failed
        # mid-build, so the next push doesn't have to re-download the
        # registry from scratch.