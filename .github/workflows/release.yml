name: release

on:
  push:
    # Conventional SemVer tag. The 'v' prefix is required because the
    # AGENTS.md release flow uses `git tag -s vX.Y.Z` locally.
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.5.0). Must exist on the remote.'
        required: true
        type: string
        # Constrains the manual path to the same shape the `push` tag
        # filter enforces; a malformed tag string fails fast in the
        # validate-tag-input job below instead of producing a
        # confusing `git rev-parse` error mid-build.
        pattern: '^v[0-9]+\.[0-9]+\.[0-9]+$'

# Releases need to write tags and create a GitHub Release page, but only the
# `publish` job does — the `build-release` job only reads repo contents. Scoping
# `contents: write` to the `publish` job applies the principle of least
# privilege at the workflow level.

# Do not let two release jobs for the same tag run in parallel; the
# second one would race the upload.
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # Tag-input validator: the `push` trigger filters to
  # `v[0-9]+.[0-9]+.[0-9]+` so a manual dispatch could otherwise
  # feed arbitrary strings (`main`, `refs/tags/v…`, leading
  # whitespace, etc.) into `git rev-parse`, producing a confusing
  # failure mid-build. This job runs first and fails fast on a
  # malformed tag name. It also confirms the tag exists on the
  # remote — the push trigger guarantees this for tag events, but
  # the dispatch path is unvalidated otherwise.
  validate-tag-input:
    name: 'Validate · tag input'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.resolve.outputs.TAG }}
    steps:
      - name: Validate tag shape
        id: resolve
        env:
          RAW: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          TAG="${RAW}"
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "ERROR: '$TAG' is not vX.Y.Z"; exit 1; }
          echo "TAG=${TAG}" >> "$GITHUB_OUTPUT"

  # Tag-reachability guard: enforces the AGENTS.md "tag the trunk
  # merge commit, NOT the branch tip" rule mechanically. If the tag's
  # commit is not an ancestor of origin/main, the workflow fails
  # before any binary is built. Defense in depth — the procedural
  # rule still lives in AGENTS.md; this job is the structural check.
  verify-tag-reachability:
    name: 'Verify · tag is reachable from main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    needs: validate-tag-input
    outputs:
      tag_commit: ${{ steps.resolve.outputs.TAG_COMMIT }}
      main_commit: ${{ steps.resolve.outputs.MAIN_COMMIT }}
    steps:
      - name: Checkout at tag SHA
        # Pinning to the resolved SHA (not the ref) closes the TOCTOU
        # gap with build-release: `git rev-parse ${TAG}^{commit}`
        # produces an immutable object SHA, and any subsequent tag
        # force-push cannot redirect the workflow to a different
        # commit. The allow-list fetch in `verify-tag-signature`
        # is the second half of the same closure.
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve tag commit + fetch main
        id: resolve
        env:
          TAG: ${{ needs.validate-tag-input.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          TAG_COMMIT="$(git rev-parse "${TAG}^{commit}")"
          MAIN_COMMIT="$(git rev-parse origin/main)"
          echo "tag=${TAG} tag_commit=${TAG_COMMIT} main_head=${MAIN_COMMIT}"
          {
            echo "TAG=${TAG}"
            echo "TAG_COMMIT=${TAG_COMMIT}"
            echo "MAIN_COMMIT=${MAIN_COMMIT}"
          } >> "$GITHUB_OUTPUT"

      - name: Fail if tag^{commit} is not an ancestor of main
        env:
          TAG: ${{ steps.resolve.outputs.TAG }}
          TAG_COMMIT: ${{ steps.resolve.outputs.TAG_COMMIT }}
          MAIN_COMMIT: ${{ steps.resolve.outputs.MAIN_COMMIT }}
        run: |
          set -euo pipefail
          if git merge-base --is-ancestor "${TAG_COMMIT}" origin/main; then
            echo "✓ ${TAG} (${TAG_COMMIT}) is reachable from origin/main (${MAIN_COMMIT})"
            exit 0
          fi
          {
            echo "ERROR: tag ${TAG} points at ${TAG_COMMIT}, which is NOT an"
            echo "ancestor of origin/main (${MAIN_COMMIT})."
            echo ""
            echo "This means the tag was created on a branch tip or a local"
            echo "commit that was later squashed away when the release PR"
            echo "was merged into main. The release would publish a binary"
            echo "whose SHA does not correspond to any commit reachable from"
            echo "main, breaking the audit log."
            echo ""
            echo "Fix (delete the orphan tag, re-tag the merge commit on main):"
            echo "  git tag -d ${TAG}"
            echo "  git push origin :refs/tags/${TAG}"
            echo "  git checkout main && git reset --hard origin/main"
            echo "  git tag -s ${TAG} \$(git rev-parse origin/main)"
            echo "  git push origin ${TAG}"
            echo ""
            echo "See AGENTS.md 'tag the trunk merge commit, NOT the branch tip'."
          } >&2
          exit 1

  # Tag-signature guard (closes #716): verifies that the tag was
  # GPG/SSH-signed by a key listed in `.github/trusted-signers`
  # before any binary is built or published. The allow-list is
  # fetched from `origin/main` (NOT the tagged tree) so revoking a
  # key on main takes effect on the next release — otherwise the
  # trust anchor is the same object being verified and revocation is
  # structurally impossible. The reachability guard proves the
  # tag points at a real commit; this guard proves a trusted
  # signer cut the release. Defense in depth — the procedural rule
  # ("`git tag -s vX.Y.Z`") still lives in AGENTS.md and
  # CONTRIBUTING.md; this job is the structural check.
  verify-tag-signature:
    name: 'Verify · tag is signed by a trusted signer'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    needs: validate-tag-input
    steps:
      - name: Fetch allow-list from origin/main
        # The trust anchor lives on `main`, not on the tagged tree
        # the workflow is verifying. Reading it from the tagged
        # tree makes key revocation ineffective: a compromised key
        # could re-cut a tag pointing at an old commit whose tree
        # still lists that key, and verification would pass.
        # Pinning to a fixed ref (origin/main) closes that gap.
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          mkdir -p "$RUNNER_TEMP/trusted"
          git show "origin/main:.github/trusted-signers" \
            > "$RUNNER_TEMP/trusted/allowed_signers"
          # `.asc` is optional: only imported when the tag is actually
          # PGP-signed (v0.13.3 and earlier). v0.13.4+ are
          # SSH-signed and never consult this file.
          if git show "origin/main:.github/trusted-signers.asc" \
              > "$RUNNER_TEMP/trusted/allowed_signers.asc" 2>/dev/null; then
            echo "GPG allow-list fetched"
          else
            echo "GPG allow-list absent on origin/main (acceptable; SSH-only signers)"
            rm -f "$RUNNER_TEMP/trusted/allowed_signers.asc"
          fi
          test -s "$RUNNER_TEMP/trusted/allowed_signers" \
            || { echo "ERROR: empty .github/trusted-signers on origin/main"; exit 1; }

      - name: Configure git to use the trusted signers file
        # `git verify-tag` consults `gpg.ssh.allowedsignersfile` for
        # SSH-signed tags and the GPG keyring for PGP-signed tags.
        # Both paths auto-detect from the tag's signature format,
        # so the same verification works for v0.13.3 (PGP) and
        # v0.13.4+ (SSH) without conditional logic.
        run: |
          set -euo pipefail
          git config gpg.format ssh
          git config gpg.ssh.allowedsignersfile "$RUNNER_TEMP/trusted/allowed_signers"

      - name: Import GPG allow-list if the tag is PGP-signed
        # v0.13.3 and earlier were PGP-signed with the maintainer's
        # RSA key. Importing into the runner's keyring only when
        # needed avoids the `.asc` becoming a hard dependency for
        # SSH-only releases (which would otherwise block the
        # documented key-removal path in AGENTS.md).
        env:
          TAG: ${{ needs.validate-tag-input.outputs.tag }}
        run: |
          set -euo pipefail
          if git cat-file tag "$TAG" | grep -q 'BEGIN PGP SIGNATURE'; then
            test -f "$RUNNER_TEMP/trusted/allowed_signers.asc" \
              || { echo "ERROR: tag is PGP-signed but .github/trusted-signers.asc is missing on origin/main"; exit 1; }
            gpg --batch --import "$RUNNER_TEMP/trusted/allowed_signers.asc"
          else
            echo "Tag uses SSH signature — GPG keyring not required"
          fi

      - name: Verify tag signature
        env:
          TAG: ${{ needs.validate-tag-input.outputs.tag }}
        run: |
          set -euo pipefail
          if git verify-tag "${TAG}"; then
            echo "✓ ${TAG} is signed by a key in .github/trusted-signers"
            exit 0
          fi
          {
            echo "ERROR: tag ${TAG} is NOT signed by a key in"
            echo ".github/trusted-signers (fetched from origin/main)."
            echo ""
            echo "Signer info for diagnosis:"
            git cat-file tag "${TAG}" \
              | grep -E '^(tagger|-----BEGIN|-----END)' \
              | head -10 >&2 || true
            echo ""
            echo "Allow-list (SSH): $(wc -l < "$RUNNER_TEMP/trusted/allowed_signers") lines"
            echo ""
            echo "Either the tag is unsigned, or it was signed by a key"
            echo "not on the allow-list."
            echo ""
            echo "Fix (re-tag with the maintainer's signing key):"
            echo "  git tag -d ${TAG}"
            echo "  git push origin :refs/tags/${TAG}"
            echo "  git tag -s ${TAG} -m 'release: ${TAG#v}'"
            echo "  git push origin ${TAG}"
            echo ""
            echo "See .github/trusted-signers and ADR 0005."
          } >&2
          exit 1

  build-release:
    name: 'Build · release binary'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    needs: [verify-tag-reachability, verify-tag-signature]
    steps:
      - name: Checkout at pinned tag SHA
        # Pinning to the immutable commit SHA (resolved by
        # `verify-tag-reachability` and propagated through the
        # job graph) closes the TOCTOU gap: a tag force-push that
        # arrives mid-workflow cannot redirect checkout away from
        # the commit the two verify jobs just approved.
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.verify-tag-reachability.outputs.tag_commit }}
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.97.1

      - name: Build release binary (stripped)
        # Cold build by design: GitHub Actions caches are scoped per-ref
        # (https://docs.github.com/en/actions/using-workflows/caching-dependencies-to-speed-up-workflows#restrictions-for-accessing-a-cache),
        # and tag-to-tag restore is forbidden. The previous
        # `Swatinem/rust-cache` step generated a fresh ~270 MB entry per
        # release that was never read again (verified empirically on
        # run id 31558391724 / v0.7.1: "No cache found." followed by a
        # full `Downloading crates ...` cold build despite the v0.6.2
        # entry existing with the same key).
        run: cargo build --release --locked

      - name: Locate binary
        id: locate
        run: |
          set -euo pipefail
          BIN="${{ github.workspace }}/target/release/moagan"
          if [[ ! -x "$BIN" ]]; then
            echo "ERROR: release binary not found at $BIN" >&2
            exit 1
          fi
          echo "path=$BIN" >> "$GITHUB_OUTPUT"
          echo "size=$(stat -c '%s' "$BIN")" >> "$GITHUB_OUTPUT"

      - name: Compute SHA-256 checksum
        id: sha256
        run: |
          BIN="${{ steps.locate.outputs.path }}"
          pushd "$(dirname "$BIN")"
          sha256sum "$(basename "$BIN")" > "$BIN.sha256"
          echo "sha256=$BIN.sha256" >> "$GITHUB_OUTPUT"

      - name: Compute SHA-512 checksum
        id: sha512
        run: |
          BIN="${{ steps.locate.outputs.path }}"
          pushd "$(dirname "$BIN")"
          sha512sum "$(basename "$BIN")" > "$BIN.sha512"
          echo "sha512=$BIN.sha512" >> "$GITHUB_OUTPUT"

      - name: Generate SBOM (CycloneDX JSON)
        # Anchore's sbom-action builds a CycloneDX JSON in-tree. The
        # default 'docker' build-mode would spin Docker; we use 'auto'
        # which detects cargo and produces a Cargo-aware SBOM.
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          format: cyclonedx-json
          artifact-name: moagan.sbom.cdx.json

      - name: Download SBOM into workspace
        # anchore/sbom-action@v0.18.0 no longer writes the SBOM to
        # the workspace; it only uploads it as a separate artifact
        # (see PR #336 — the Node-24 bump). Pull the SBOM back into
        # the workspace root so the downstream Bundle step's
        # `cp ${{ github.workspace }}/moagan.sbom.cdx.json` finds
        # it. The action's own artifact upload is preserved (so the
        # SBOM remains downloadable via the run page); we just need
        # the file on disk too.
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: moagan.sbom.cdx.json
          path: ${{ github.workspace }}/

      - name: Verify SBOM downloaded
        # v8 of actions/download-artifact removed `if-no-files-found`,
        # so we explicitly fail-fast when the SBOM file isn't on disk.
        # The downstream Bundle step's `cp` would also fail (because
        # of `set -euo pipefail`), but a clearer error message lands
        # earlier in the run log.
        run: |
          test -f "${{ github.workspace }}/moagan.sbom.cdx.json" \
            || { echo "ERROR: SBOM file missing after download"; exit 1; }

      - name: Smoke gate (binary sanity)
        # The release artifact must at least load and reach the clap
        # parser before it gets uploaded. This is the "release-smoke"
        # pattern from ftp-deployment-action: catch a broken build
        # before signing & publishing. Full smoke (make smoke) runs
        # in the regular CI pipeline; here we only need to know the
        # binary is well-formed.
        run: |
          set -euo pipefail
          BIN="${{ steps.locate.outputs.path }}"
          "$BIN" --version
          "$BIN" --help | head -20

      - name: Bundle artifacts
        run: |
          set -euo pipefail
          BIN="${{ steps.locate.outputs.path }}"
          ART_DIR="${{ runner.temp }}/release-artifacts"
          mkdir -p "$ART_DIR"
          cp "$BIN" "$ART_DIR/moagan"
          cp "$BIN.sha256" "$ART_DIR/moagan.sha256"
          cp "$BIN.sha512" "$ART_DIR/moagan.sha512"
          cp "${{ github.workspace }}/moagan.sbom.cdx.json" "$ART_DIR/"
          ls -la "$ART_DIR"

      - name: Upload bundle for the publisher job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: moagan-release-bundle
          path: ${{ runner.temp }}/release-artifacts/
          retention-days: 7
          if-no-files-found: error

  publish:
    name: 'Publish · GitHub Release'
    needs: build-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: moagan-release-bundle
          path: release/

      - name: Extract metadata
        id: meta
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@fe965f7af51af5f2602596916f38a38df2e33de0 # v3.0.2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "v${{ steps.meta.outputs.version }}"
          generate_release_notes: true
          # Upload all artefacts in the bundle (binary + sha256 + sha512 + SBOM).
          files: |
            release/moagan
            release/moagan.sha256
            release/moagan.sha512
            release/moagan.sbom.cdx.json
          fail_on_unmatched_files: true
          # Mark this as the latest release unless the tag is a pre-release.
          prerelease: ${{ contains(steps.meta.outputs.version, '-') }}
