name: test-ignored-opencode

# Manual-only post-merge validation for the OpenCode provider.
# Triggers exclusively on `workflow_dispatch:` so it costs zero runner
# minutes and zero upstream tokens on every push to `main`. Dispatch
# from the Actions tab when you actually want to exercise the
# integration_discover_opencode test path; otherwise the workflow
# sits silently in the workflow list with no green check on every
# commit (the misleading "STUB but green" pattern was the rationale
# for removing the auto-trigger in PR #550 / PR #555).
#
# Both jobs (preflight-opencode + test-ignored-opencode) do real
# work when the workflow fires:
# - `preflight-opencode` probes the upstream with a 30 s HTTP call
#   against https://opencode.ai/zen/go/v1/models. Exit 0 + SKIP line
#   when OPENCODE_API_KEY is absent on the runner; non-2xx exits 1
#   (the gating signal the test job `needs:`'s).
# - `test-ignored-opencode` runs `cargo test --test
#   integration_discover_opencode -- --ignored`. Early-returns via
#   `Skip` on secret-absent (the test body checks for that first), so
#   a fork without the key still goes green.
#
# Timeout 120 min per job covers the degraded-upstream case (~45 min
# on a healthy local run, ~90 min on a slow upstream).
#
# v0.12.12 (§2.3): renamed from `test-ignored-opencode-go.yml`,
# `OPENCODE_API_KEY` is the canonical env var (the dispatcher maps
# the `opencode` section to it). Restored from the PR #525 shape
# on 2026-08-19 (PR #555 had previously collapsed this file to a
# 1-job `disabled-stub` banner); the auto `push: branches: [main]`
# trigger is deliberately NOT added because the OpenCode budget is
# non-trivial and we want each merge to main to be cheap even when
# the budget is back.

on:
  workflow_dispatch:

# Serialize concurrent runs in FIFO order — do NOT cancel in-flight runs.
# The trigger here is workflow_dispatch only (no auto push: branches:
# [main]), so today the cancel path is unreachable; kept as `false` for
# symmetry with test-ignored-minimax.yml (closes #738) so a future PR
# that re-enables the auto push trigger (per ci.yml:46-53 budget
# context) does not reintroduce the wasted-API-token + red-commit bug.
concurrency:
  group: test-ignored-opencode-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight-opencode:
    name: 'T3 · preflight — opencode'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: probe opencode
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          if [[ -z "${OPENCODE_API_KEY:-}" ]]; then
            echo "SKIP: OPENCODE_API_KEY not set"
            exit 0
          fi
          echo "OPENCODE: set, length=${#OPENCODE_API_KEY}, prefix=${OPENCODE_API_KEY:0:8}...${OPENCODE_API_KEY: -4}"
          HTTP=$(timeout 30 curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $OPENCODE_API_KEY" \
            'https://opencode.ai/zen/go/v1/models' || echo "TIMEOUT")
          echo "OPENCODE http_status: $HTTP"
          [[ "$HTTP" =~ ^2 ]] || exit 1

  test-ignored-opencode:
    name: 'T2 · cargo test -- --ignored (opencode)'
    needs: preflight-opencode
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048fb273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/rust-setup
        with:
          components: rustfmt,clippy
      - name: prepare logs directory
        run: mkdir -p logs

      - name: cargo test integration_discover_opencode -- --ignored (gated on OPENCODE_API_KEY)
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          bash -c '
          echo "============================================================"
          echo "DIAGNOSTIC HEADER"
          echo "  GitHub Actions run: $GITHUB_RUN_ID / attempt $GITHUB_RUN_ATTEMPT"
          echo "  Runner:             $(uname -a)"
          echo "  Working directory:  $(pwd)"
          echo "  Date (UTC):         $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "  Provider under test: opencode"
          echo "============================================================"
          echo "API key presence:"
          echo "  OPENCODE_API_KEY set: $([[ -n "${OPENCODE_API_KEY:-}" ]] && echo yes || echo no)"
          echo "  OPENCODE_API_KEY length: ${#OPENCODE_API_KEY} chars"
          echo "============================================================"
          if [[ -z "${OPENCODE_API_KEY:-}" ]]; then
            echo "SKIP: OPENCODE_API_KEY not set on runner; opencode --ignored test not run"
            exit 0
          fi
          echo "Starting cargo test at $(date -u +%H:%M:%SZ)..."
          START_TS=$(date +%s)
          cargo test --test integration_discover_opencode -- --ignored --nocapture
          CARGO_RC=$?
          END_TS=$(date +%s)
          echo "============================================================"
          echo "cargo test finished at $(date -u +%H:%M:%SZ) (wall-clock $((END_TS - START_TS))s, rc=$CARGO_RC)"
          echo "============================================================"
          exit $CARGO_RC
          ' > logs/${{ github.job }}-stdout.log 2> logs/${{ github.job }}-stderr.log

      - name: gzip captured logs
        if: always()
        run: |
          gzip -9 -f logs/${{ github.job }}-stdout.log logs/${{ github.job }}-stderr.log || true
          ls -la logs/ || true

      - name: upload test-ignored artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: moagan-test-ignored-opencode-logs
          path: target/test-runs/opencode/
          retention-days: 1
          if-no-files-found: warn

      - name: upload moagan stdout artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: moagan-${{ github.job }}-stdout
          path: logs/${{ github.job }}-stdout.log.gz
          retention-days: 7
          if-no-files-found: warn

      - name: upload moagan stderr artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: moagan-${{ github.job }}-stderr
          path: logs/${{ github.job }}-stderr.log.gz
          retention-days: 7
          if-no-files-found: warn

      - name: print artifact hint on failure
        if: failure()
        run: |
          echo "::error::Moagan run failed in '${{ github.job }}'. Full stdout is in the 'moagan-${{ github.job }}-stdout' artifact and full stderr is in 'moagan-${{ github.job }}-stderr' (retention: 7 days)."