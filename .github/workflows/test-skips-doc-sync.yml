name: test-skips-doc-sync

# EPIC #852: regenerate `docs/test-skips-report.md` from the live
# codebase (8 layers: ruleset, --skip CLI flag, #[ignore] attribute,
# silent-skip regex walker, ValidationEvidence::skipped() walker,
# `MOAGAN_PRINT_TEST_GROUPS` proxy manifest, lefthook escape hatches,
# TEST_*_LOCK statics). The docgen binary is gated behind
# `--features dev-tools` so the default `cargo build` does not pay the
# cost of compiling it.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

# Per maintainer policy (ADR-0011), no workflow cancels in-flight runs.
# group keyed on run_id (with workflow-name prefix matching
# e2e-network*.yml's convention) so every push becomes its own
# concurrency group.
concurrency:
  group: test-skips-doc-sync-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  sync:
    name: 'Docgen · test-skips-report'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-setup
        with:
          components: rustfmt
          shared-key: moagan-dev
      # No `moagan` build: Layer 6 runs `scripts/e2e_audit_proxy.sh`
      # with MOAGAN_PRINT_TEST_GROUPS=1, which prints the manifest
      # before it looks for the binary (#998).
      - name: Build moagan-docgen
        run: cargo build --features dev-tools --bin moagan-docgen
      # No apt step: the Layer 4 silent-skip walker matches Rust
      # source with a regex and never runs cargo, tsc, python3 or
      # sqlite3, so the report does not depend on which binaries the
      # runner has. An apt mirror stall once held this job until the
      # 10-minute timeout cancelled it.
      - name: Regenerate docs/test-skips-report.md
        run: ./target/debug/moagan-docgen test-skips > docs/test-skips-report.md
      - name: Fail on drift
        run: |
          if ! git diff --exit-code -- docs/test-skips-report.md; then
            echo "::error::docs/test-skips-report.md is out of sync with the live codebase."
            echo "Run \`cargo run --features dev-tools --bin moagan-docgen -- test-skips > docs/test-skips-report.md\` locally and commit the result."
            exit 1
          fi
