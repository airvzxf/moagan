name: cleanup-actions-cache

# Delete every Actions cache entry the ADR-0014 policy does not need.
#
# Only main writes the rust-cache, one job per shared key (enforced by
# scripts/check-ci-cache-policy.sh). What survives a run of this
# workflow is therefore exactly one entry per live shared key: the
# newest one on refs/heads/main. Everything else goes:
#   - entries of any other ref (pull requests, branches, tags);
#   - main entries superseded by a Cargo.lock, Cargo.toml or toolchain
#     change (same shared key, older entry);
#   - main entries of a shared key no workflow uses any more.
# The decision is the pure function scripts/ci-cache-prune.sh (spec:
# scripts/test-ci-cache-prune.sh); this workflow only lists and deletes.
# The live keys are read from the workflows themselves, so the
# `shared-key:` lines stay the single source of truth.
#
# Triggers: after every ci / post-release-validation run on main (the
# only runs that can write an entry, so a superseded entry lives
# minutes, not days), nightly as a safety net, and by hand.
#
# Silent-failure guards (history: #893, #895): a failing `gh cache
# list` aborts with `::error::`; a prune error (malformed listing)
# aborts before anything is deleted; any failed delete fails the run.
#
# DRY_RUN input: `dry_run: true` in the `workflow_dispatch` UI prints
# the delete plan without mutating.

on:
  workflow_run:
    workflows: [ci, post-release-validation]
    types: [completed]
    branches: [main]
  schedule:
    # 02:30 UTC daily — outside the typical CI peak.
    - cron: '30 2 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'DRY RUN — log what would be deleted, do not delete'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

# Pattern B of ADR-0011: one fixed group, FIFO, nothing cancelled. Two
# cleanups racing on the same entry would make the second delete fail.
concurrency:
  group: cleanup-actions-cache
  cancel-in-progress: false
  queue: max

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    name: 'Cache cleanup (keep main''s newest entry per live key)'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: main

      - name: Delete caches the policy does not need
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t KEYS < <(grep -rhoE '^\s*shared-key:\s*[A-Za-z0-9._-]+' .github/workflows \
            | awk '{print $2}' | sort -u)
          if (( ${#KEYS[@]} == 0 )); then
            echo "::error::no shared-key found in .github/workflows; refusing to prune."
            exit 1
          fi
          echo "Live shared keys: ${KEYS[*]}"

          # Exit codes are captured explicitly instead of trusting
          # `set -e` with command substitutions (#893).
          set +e
          LISTING="$(gh cache list --repo "$REPO" --limit 100 \
            --json id,ref,createdAt,key \
            --jq '.[] | [(.id|tostring), .ref, .createdAt, .key] | @tsv')"
          LIST_RC=$?
          set -e
          if (( LIST_RC != 0 )); then
            echo "::error::gh cache list exited $LIST_RC; aborting."
            exit "$LIST_RC"
          fi
          echo "Entries before cleanup:"
          printf '%s\n' "$LISTING" | awk -F '\t' 'NF { print "  " $2 "  " $4 }'

          set +e
          DOOMED="$(printf '%s\n' "$LISTING" | bash scripts/ci-cache-prune.sh "${KEYS[@]}")"
          PRUNE_RC=$?
          set -e
          if (( PRUNE_RC != 0 )); then
            echo "::error::ci-cache-prune.sh exited $PRUNE_RC; nothing deleted."
            exit "$PRUNE_RC"
          fi

          DELETED=0
          FAILED=0
          while read -r ID; do
            [[ -z "$ID" ]] && continue
            ENTRY="$(printf '%s\n' "$LISTING" | awk -F '\t' -v id="$ID" '$1 == id { print $2 "  " $4 }')"
            if [[ "$DRY_RUN" == "true" ]]; then
              echo "DRY-RUN delete id=$ID  $ENTRY"
              DELETED=$((DELETED + 1))
            elif gh cache delete "$ID" --repo "$REPO" >/dev/null 2>&1; then
              echo "deleted id=$ID  $ENTRY"
              DELETED=$((DELETED + 1))
            else
              echo "::error::delete failed id=$ID  $ENTRY"
              FAILED=$((FAILED + 1))
            fi
          done <<< "$DOOMED"

          echo "Cleanup complete: $DELETED deleted, $FAILED failed (dry_run=$DRY_RUN)."
          if (( FAILED > 0 )); then
            exit 1
          fi
