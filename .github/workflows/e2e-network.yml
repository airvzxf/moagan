name: e2e-network

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_long_discover:
        description: 'Skip the ~20 min card80 long-discover block (real LLM, ~5 min). Default: full 25 min run.'
        type: boolean
        required: false
        default: false
      section:
        description: 'Which SECTION A sub-block to run. `all` (default) runs the 3 rows in parallel; pick a single one to iterate without paying the rest. `card80` ~25 min, `fast` ~2 min, `explore` ~8 min.'
        type: choice
        required: false
        default: all
        options:
          - all
          - card80
          - fast
          - explore

# Minimum token permissions: read repo contents. The MINIMAX_API_KEY is
# consumed via `secrets.*` and never written back to the repo.
permissions:
  contents: read

# Long-running end-to-end suite that exercises the real MiniMax upstream.
# Intentionally NOT part of the per-PR pipeline: it costs API calls and
# ~25 minutes of runner time. Run only after merge to main.
#
# The audit_e2e suite (scripts/e2e_audit_proxy.sh) historically ran as
# ONE job inside one `timeout-minutes: 30` budget; the three sub-blocks
# (card80 ~25 min + mode fast ~2 min + mode explore ~8 min) totalled
# ~35 min and the runner killed the job every push to main
# (e.g. runs #31347440577, #31358516915). This workflow turns the three
# sub-blocks into a 3-row `strategy.matrix` so they run in parallel on
# push (wall-clock = slowest, ~25 min) and each row gets its own job
# timeout (28 / 6 / 12 min). `fail-fast: false` keeps the other rows
# running when one fails so the operator can debug a real-LLM flake
# without losing the coverage of the other two sections.
#
# On `workflow_dispatch` the operator can narrow the run to a single
# row via `inputs.section`; on `push` (where `inputs.section` is
# undefined) the matrix falls through to the `all` branch and all three
# rows run. `inputs.skip_long_discover` is preserved exactly as it was
# before — it still sets MOAGAN_SMOKE_LONG_DISCOVER=1 for the runner
# that picks the card80 row.
#
# Reference: docs/validation-tiers.md (Tier 3, main-only).
#
# Uses the same .github/actions/rust-setup composite as ci.yml:
# Swatinem/rust-cache@v2 (cache-on-failure: true) shares the target/
# dir across all jobs in the workflow. The previous actions/cache@v4
# block was replaced in PR #236 to keep cache format consistent across
# the whole pipeline.

jobs:
  e2e-network:
    name: "Tier 3 · e2e against real LLM (main only) — ${{ matrix.section }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The `include` rows enumerate the three sub-blocks AND the
        # per-row budget. The `section` key below is computed at
        # runtime: on `push` `inputs.section` is undefined so the
        # `fromJSON` falls through to the `all` branch and all three
        # rows run in parallel; on `workflow_dispatch` with a chosen
        # section, only the corresponding row runs.
        include:
          - section: card80
            make_target: e2e-network-card80
            timeout_minutes: 28
          - section: fast
            make_target: e2e-network-fast
            timeout_minutes: 6
          - section: explore
            make_target: e2e-network-explore
            timeout_minutes: 12
        section: ${{ fromJSON(inputs.section == 'all' && '["card80","fast","explore"]' || format('["{0}"]', inputs.section)) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: ./.github/actions/rust-setup

      - name: Show toolchain
        run: |
          cargo --version
          rustc --version

      - name: Build release binary
        run: cargo build --release

      - name: Verify MiniMax API key is present
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        run: |
          if [[ -z "${MINIMAX_API_KEY:-}" ]]; then
            echo "ERROR: MINIMAX_API_KEY secret is not configured on this runner." >&2
            echo "Add it via: gh secret set MINIMAX_API_KEY --repo airvzxf/moagan" >&2
            exit 1
          fi
          echo "OK: MINIMAX_API_KEY is set ($(echo -n "$MINIMAX_API_KEY" | wc -c) chars)"

      - name: T3 · e2e-network (${{ matrix.section }}, real LLM)
        timeout-minutes: ${{ matrix.timeout_minutes }}
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          # The e2e_audit_proxy.sh script checks BIN at target/debug/moagan by
          # default. The workflow builds release, so override the path.
          BIN: ${{ github.workspace }}/target/release/moagan
          # The Makefile target already sets MOAGAN_SMOKE_SECTION, but
          # we re-export it here so the script's own guard sees the
          # same value as the matrix row (defence-in-depth against a
          # future contributor adding a manual `bash scripts/...`
          # invocation that bypasses the Makefile).
          MOAGAN_SMOKE_SECTION: ${{ matrix.section }}
          # Expose the `skip_long_discover` input as the env var the
          # e2e_audit_proxy.sh script reads (default: 0 = full card80
          # block). Push events ignore the input; workflow_dispatch
          # with `skip_long_discover: true` overrides to '1' for a
          # ~5 min card80 run. The mode-fast and mode-explore rows
          # ignore this knob — the long-discover skip is a card80-only
          # thing.
          MOAGAN_SMOKE_LONG_DISCOVER: ${{ inputs.skip_long_discover == 'true' && '1' || '0' }}
        run: make ${{ matrix.make_target }}
