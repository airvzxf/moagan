name: e2e-network

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_long_discover:
        description: 'Skip the ~20 min card80 long-discover block (real LLM, ~5 min). Default: full 25 min run.'
        type: boolean
        required: false
        default: false
      section:
        description: 'Which section A sub-block to run. `all` (default) runs every section; pick a single one to iterate without paying the rest. `card80` ~25 min, `fast` ~2 min, `explore` ~8 min, `discover_opencode_go` ~20 min, `discover_deepseek` ~20 min, `discover_opencode_go_models` ~70 min (14-model coverage loop).'
        type: choice
        required: false
        default: all
        options:
          - all
          - card80
          - fast
          - explore
          - discover_opencode_go
          - discover_deepseek
          - discover_opencode_go_models

# Serialize concurrent runs that touch the same section set so the
# artifact upload from `build` doesn't race a `test-*` job's download.
concurrency:
  group: e2e-network-${{ github.event.inputs.section || github.run_id }}
  cancel-in-progress: false

# Minimum token permissions: read repo contents. The MINIMAX_API_KEY,
# OPENCODE_GO_API_KEY and DEEPSEEK_API_KEY secrets are consumed via
# `secrets.*` and never written back to the repo.
permissions:
  contents: read

# Long-running end-to-end suite that exercises the real MiniMax upstream.
# Intentionally NOT part of the per-PR pipeline: it costs API calls and
# ~25 minutes of runner time. Run only after merge to main.
#
# Architecture (build-once + per-job conditions, supersedes the
# 3-row matrix that built the release binary once per row):
#
#   build-e2e-network  — runs once, uploads target/release/moagan as the
#                        `moagan-e2e-binary` artifact.
#   validate-providers — needs: build-e2e-network; preflight HTTP
#                        probe (deepseek, opencode_go, minimax) that
#                        gates the five push-on test jobs below. ~30 s.
#   test-card80        — needs: build-e2e-network, validate-providers;
#                        gated on inputs.section in {card80, all, ''}.
#   test-fast          — needs: build-e2e-network, validate-providers;
#                        gated on inputs.section in {fast, all, ''}.
#   test-explore       — needs: build-e2e-network, validate-providers;
#                        gated on inputs.section in {explore, all, ''}.
#   test-discover-opencode-go
#                      — needs: build-e2e-network, validate-providers;
#                        gated on inputs.section in {discover_opencode_go,
#                        all, ''}. Consumes OPENCODE_GO_API_KEY, not
#                        MINIMAX_API_KEY.
#   test-discover-deepseek
#                      — needs: build-e2e-network, validate-providers;
#                        gated on inputs.section in {discover_deepseek,
#                        all, ''}. Consumes DEEPSEEK_API_KEY.
#   test-discover-opencode-go-models
#                      — needs: build-e2e-network (NOT gated on the
#                        validator — this job is dispatch-only and the
#                        14-model × ~5 min loop pays for the validator
#                        itself). Gated on inputs.section in
#                        {discover_opencode_go_models, all}. NOT gated
#                        on '' — this job is dispatch-only, see below.
#                        The per-model coverage loop: 14 opencode_go
#                        aliases × ~5 min each ≈ 70 min. Consumes
#                        OPENCODE_GO_API_KEY.
#
# On `push` events `inputs.section` is undefined (= ''), so the five
# test jobs whose condition includes '' run in parallel after
# `build-e2e-network` completes (wall-clock ≈ slowest row, ~25 min). On
# `workflow_dispatch` with `section=<x>`, only the matching `test-<x>`
# job is materialised — the others don't even appear in the run page.
# This replaces the previous matrix-filter cascade that always
# materialised all three rows and then pruned two of them.
#
# `test-discover-opencode-go-models` is the one exception: it is
# deliberately dispatch-only (no `|| inputs.section == ''`). At ~70 min
# of runner time and 14 real discovery runs of API spend, paying it on
# every push to main is not sustainable. The cheaper single-provider
# jobs `test-discover-opencode-go` and `test-discover-deepseek` stay
# push-on and are what catch opencode_go / deepseek regressions; the
# full per-model sweep is opt-in via `workflow_dispatch` with
# `section: discover_opencode_go_models` (just the loop) or
# `section: all` (the loop plus everything else).
#
# The three discovery jobs (added for Tier A #8/#9/#10 of
# `docs/pending-items-2026-08-13.md` §11) are what turn the
# opencode_go / deepseek discovery blocks of
# `scripts/e2e_audit_proxy.sh` from "never executed in CI" (§9.2) into
# a real network round-trip. Each block self-skips when its API key
# secret is absent, so a fork or a runner without the secret stays
# green instead of failing.
#
# `inputs.skip_long_discover` is preserved exactly as before — it
# still sets MOAGAN_SMOKE_LONG_DISCOVER=1 for the runner that picks
# the card80 row.
#
# Reference: docs/validation-tiers.md (Tier 3, main-only).
#
# Uses the same .github/actions/rust-setup composite as ci.yml:
# Swatinem/rust-cache@v2 (cache-on-failure: true) shares the target/
# dir across all jobs in the workflow. The previous actions/cache@v4
# block was replaced in PR #236 to keep cache format consistent across
# the whole pipeline.

jobs:
  build-e2e-network:
    name: 'Build · release binary'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: ./.github/actions/rust-setup

      - name: Show toolchain
        run: |
          cargo --version
          rustc --version

      - name: Build release binary
        env:
          # Overriding it here on the step that actually runs cargo
          # lets the workspace's own .rmeta / .o files (now in the
          # cache thanks to `cache-workspace-crates: true` in
          # rust-setup/action.yml) drive incremental compilation.
          CARGO_INCREMENTAL: '1'
        run: cargo build --release

      - name: Verify MiniMax API key is present
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        run: |
          if [[ -z "${MINIMAX_API_KEY:-}" ]]; then
            echo "ERROR: MINIMAX_API_KEY secret is not configured on this runner." >&2
            echo "Add it via: gh secret set MINIMAX_API_KEY --repo airvzxf/moagan" >&2
            exit 1
          fi
          echo "OK: MINIMAX_API_KEY is set ($(echo -n "$MINIMAX_API_KEY" | wc -c) chars)"

      - name: Upload binary for matrix jobs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: moagan-e2e-binary
          path: target/release/moagan
          retention-days: 1
          if-no-files-found: error

  # Pre-flight provider API validator for the e2e-network suite. Probes
  # deepseek, opencode_go and minimax upstream /v1/models with a 30 s
  # timeout; if any probe returns non-2xx (401, 403, 5xx, timeout,
  # network error) the validator fails and the five `test-*` jobs that
  # `needs:` it are SKIPPED — that is the desired GitHub Actions
  # signal for a dead upstream. Prevents ~25 min of wasted runner time
  # on a provider outage (PR #473). Secret-absent → SKIP (exit 0) so
  # fork PRs without secrets stay green. Only echoes presence, length,
  # prefix (first 8 chars), and the HTTP status code; never the secret
  # value. The validator needs the release binary build because the
  # test jobs that depend on it also need it, and adding the
  # dependency keeps the gate serial rather than racy.
  validate-providers:
    name: 'T3 · preflight — validate provider APIs'
    needs: build-e2e-network
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: probe deepseek
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [[ -z "${DEEPSEEK_API_KEY:-}" ]]; then
            echo "SKIP: DEEPSEEK_API_KEY not set"
            exit 0
          fi
          echo "DEEPSEEK: set, length=${#DEEPSEEK_API_KEY}, prefix=${DEEPSEEK_API_KEY:0:8}"
          HTTP=$(timeout 30 curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $DEEPSEEK_API_KEY" \
            'https://api.deepseek.com/v1/models' || echo "TIMEOUT")
          echo "DEEPSEEK http_status: $HTTP"
          [[ "$HTTP" =~ ^2 ]] || exit 1

      - name: probe opencode_go
        env:
          OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
        run: |
          if [[ -z "${OPENCODE_GO_API_KEY:-}" ]]; then
            echo "SKIP: OPENCODE_GO_API_KEY not set"
            exit 0
          fi
          echo "OPENCODE_GO: set, length=${#OPENCODE_GO_API_KEY}, prefix=${OPENCODE_GO_API_KEY:0:8}"
          HTTP=$(timeout 30 curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $OPENCODE_GO_API_KEY" \
            'https://opencode.ai/zen/go/v1/models' || echo "TIMEOUT")
          echo "OPENCODE_GO http_status: $HTTP"
          [[ "$HTTP" =~ ^2 ]] || exit 1

      - name: probe minimax
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        run: |
          if [[ -z "${MINIMAX_API_KEY:-}" ]]; then
            echo "SKIP: MINIMAX_API_KEY not set"
            exit 0
          fi
          echo "MINIMAX: set, length=${#MINIMAX_API_KEY}, prefix=${MINIMAX_API_KEY:0:8}"
          HTTP=$(timeout 30 curl -sS -o /dev/null -w '%{http_code}' \
            -H "x-api-key: $MINIMAX_API_KEY" \
            -H "anthropic-version: 2023-06-01" \
            'https://api.minimax.io/anthropic/v1/models' || echo "TIMEOUT")
          echo "MINIMAX http_status: $HTTP"
          [[ "$HTTP" =~ ^2 ]] || exit 1

  test-card80:
    name: 'Tier 3 · e2e — card80'
    needs: [build-e2e-network, validate-providers]
    if: ${{ inputs.section == 'card80' || inputs.section == 'all' || inputs.section == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: moagan-e2e-binary
          path: target/release/

      - name: Change to executable binary
        run: chmod +x target/release/moagan

      - name: T3 · e2e-network (card80, real LLM)
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          # The e2e_audit_proxy.sh script checks BIN at target/debug/moagan by
          # default. The build job built release, so override the path.
          BIN: ${{ github.workspace }}/target/release/moagan
          # The Makefile target already sets MOAGAN_SMOKE_SECTION, but
          # we re-export it here so the script's own guard sees the
          # same value (defence-in-depth against a future contributor
          # adding a manual `bash scripts/...` invocation that
          # bypasses the Makefile).
          MOAGAN_SMOKE_SECTION: card80
          # Expose the `skip_long_discover` input as the env var the
          # e2e_audit_proxy.sh script reads (default: 0 = full card80
          # block). Push events ignore the input; workflow_dispatch
          # with `skip_long_discover: true` overrides to '1' for a
          # ~5 min card80 run. The fast / explore rows ignore this
          # knob — the long-discover skip is a card80-only thing.
          MOAGAN_SMOKE_LONG_DISCOVER: ${{ inputs.skip_long_discover == 'true' && '1' || '0' }}
        run: make e2e-network-card80

  test-fast:
    name: 'Tier 3 · e2e — fast'
    needs: [build-e2e-network, validate-providers]
    if: ${{ inputs.section == 'fast' || inputs.section == 'all' || inputs.section == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: moagan-e2e-binary
          path: target/release/

      - name: Change to executable binary
        run: chmod +x target/release/moagan

      - name: T3 · e2e-network (fast, real LLM)
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          BIN: ${{ github.workspace }}/target/release/moagan
          MOAGAN_SMOKE_SECTION: fast
          MOAGAN_SMOKE_LONG_DISCOVER: ${{ inputs.skip_long_discover == 'true' && '1' || '0' }}
        run: make e2e-network-fast

  test-explore:
    name: 'Tier 3 · e2e — explore'
    needs: [build-e2e-network, validate-providers]
    if: ${{ inputs.section == 'explore' || inputs.section == 'all' || inputs.section == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: moagan-e2e-binary
          path: target/release/

      - name: Change to executable binary
        run: chmod +x target/release/moagan

      - name: T3 · e2e-network (explore, real LLM)
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          BIN: ${{ github.workspace }}/target/release/moagan
          MOAGAN_SMOKE_SECTION: explore
          MOAGAN_SMOKE_LONG_DISCOVER: ${{ inputs.skip_long_discover == 'true' && '1' || '0' }}
        run: make e2e-network-explore

  # Tier A #8 (docs/pending-items-2026-08-13.md §11): the A.bis
  # discovery block of scripts/e2e_audit_proxy.sh had no CI job, so
  # it had never run outside an operator's laptop. Gated on
  # OPENCODE_GO_API_KEY; the script prints "SKIP: …" and exits 0 when
  # the secret is absent.
  test-discover-opencode-go:
    name: 'Tier 3 · e2e — discover_opencode_go'
    needs: [build-e2e-network, validate-providers]
    if: ${{ inputs.section == 'discover_opencode_go' || inputs.section == 'all' || inputs.section == '' }}
    runs-on: ubuntu-latest
    # One discovery round (~5 min of wire time) plus generous headroom
    # for a degraded upstream: the opencode_go /messages wire is fast
    # but /chat/completions and /responses can add up.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: moagan-e2e-binary
          path: target/release/

      - name: Change to executable binary
        run: chmod +x target/release/moagan

      - name: T3 · e2e-network (discover_opencode_go, real LLM)
        env:
          OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
          BIN: ${{ github.workspace }}/target/release/moagan
          MOAGAN_SMOKE_SECTION: discover_opencode_go
        run: make e2e-network-discover-opencode-go

  # Tier A #8, deepseek half: same shape as the job above but gated on
  # DEEPSEEK_API_KEY and pointed at the native `deepseek` provider
  # (api.deepseek.com), not the opencode_go relay.
  test-discover-deepseek:
    name: 'Tier 3 · e2e — discover_deepseek'
    needs: [build-e2e-network, validate-providers]
    if: ${{ inputs.section == 'discover_deepseek' || inputs.section == 'all' || inputs.section == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: moagan-e2e-binary
          path: target/release/

      - name: Change to executable binary
        run: chmod +x target/release/moagan

      - name: T3 · e2e-network (discover_deepseek, real LLM)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          BIN: ${{ github.workspace }}/target/release/moagan
          MOAGAN_SMOKE_SECTION: discover_deepseek
        run: make e2e-network-discover-deepseek

  # Tier A #9: the per-model coverage loop. 14 opencode_go aliases run
  # sequentially at ~5 min each, so the ceiling is deliberately ~90 min
  # — by far the longest job in the repo. It is the only thing that
  # exercises the /v1/responses (gpt-5.6-luna) and /v1/messages
  # (qwen3.*) wire formats against a real upstream; before it, only
  # /v1/chat/completions had ever made a real request (§9.3).
  #
  # Dispatch-only on purpose: the `if` below omits the
  # `|| inputs.section == ''` arm the other jobs carry, so a `push` to
  # main does NOT pay ~70 min of runner time and 14 real discovery runs
  # of API spend. Opt in with `workflow_dispatch` +
  # `section: discover_opencode_go_models`, or `section: all`.
  test-discover-opencode-go-models:
    name: 'Tier 3 · e2e — discover_opencode_go_models (14 models, ~70 min)'
    needs: build-e2e-network
    if: ${{ inputs.section == 'discover_opencode_go_models' || inputs.section == 'all' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: moagan-e2e-binary
          path: target/release/

      - name: Change to executable binary
        run: chmod +x target/release/moagan

      - name: T3 · e2e-network (discover_opencode_go_models, real LLM)
        env:
          OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
          BIN: ${{ github.workspace }}/target/release/moagan
          MOAGAN_SMOKE_SECTION: discover_opencode_go_models
        run: make e2e-network-discover-opencode-go-models
