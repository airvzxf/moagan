name: e2e-network

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_long_discover:
        description: 'Skip the ~20 min card80 long-discover block (real LLM, ~5 min). Default: full 25 min run.'
        type: boolean
        required: false
        default: false

# Minimum token permissions: read repo contents. The MINIMAX_API_KEY is
# consumed via `secrets.*` and never written back to the repo.
permissions:
  contents: read

# Long-running end-to-end suite that exercises the real MiniMax upstream.
# Intentionally NOT part of the per-PR pipeline: it costs API calls and
# ~25 minutes of runner time. Run only after merge to main.
# The audit_e2e long-discover block (~20 min) can be skipped by setting
# MOAGAN_SMOKE_LONG_DISCOVER=1 in the runner environment. The
# `workflow_dispatch` input `skip_long_discover` exposes that knob
# without editing the workflow file (push-to-main behaviour is
# unchanged — the full card80 block runs every time).
# Reference: docs/validation-tiers.md (Tier 3, main-only).
#
# Uses the same .github/actions/rust-setup composite as ci.yml:
# Swatinem/rust-cache@v2 (cache-on-failure: true) shares the target/
# dir across all jobs in the workflow. The previous actions/cache@v4
# block was replaced in PR #236 to keep cache format consistent across
# the whole pipeline.

jobs:
  e2e-network:
    name: "Tier 3 · e2e against real LLM (main only)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: ./.github/actions/rust-setup

      - name: Show toolchain
        run: |
          cargo --version
          rustc --version

      - name: Build release binary
        run: cargo build --release

      - name: Verify MiniMax API key is present
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        run: |
          if [[ -z "${MINIMAX_API_KEY:-}" ]]; then
            echo "ERROR: MINIMAX_API_KEY secret is not configured on this runner." >&2
            echo "Add it via: gh secret set MINIMAX_API_KEY --repo airvzxf/moagan" >&2
            exit 1
          fi
          echo "OK: MINIMAX_API_KEY is set ($(echo -n "$MINIMAX_API_KEY" | wc -c) chars)"

      - name: T3 · e2e-network (real LLM, ~25 min)
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          # The e2e_audit_proxy.sh script checks BIN at target/debug/moagan by
          # default. The workflow builds release, so override the path.
          BIN: ${{ github.workspace }}/target/release/moagan
          # Expose the `skip_long_discover` input as the env var the
          # e2e_audit_proxy.sh script reads (default: 0 = full card80
          # block). Push events ignore the input; workflow_dispatch with
          # `skip_long_discover: true` overrides to '1' for a ~5 min run.
          MOAGAN_SMOKE_LONG_DISCOVER: ${{ inputs.skip_long_discover == 'true' && '1' || '0' }}
        run: make e2e-network