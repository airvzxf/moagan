name: test-ignored-deepseek

on:
  workflow_dispatch:

# Stub workflow. Originally fired on every push to main and on manual
# dispatch (PR #525), then auto-stubbed to a single-job "DISABLED"
# banner (PR #529, native DeepSeek budget exhausted).
#
# On 2026-08-19 the `push: branches: [main]` trigger was removed
# entirely. The workflow now runs ONLY when the maintainer dispatches
# it manually (`workflow_dispatch`). When dispatched, the
# `disabled-stub` job prints the DISABLED banner as the
# maintainer-facing reminder.
#
# Rationale: with the auto path gone, the workflow sits silently in
# the workflow list — no runner minutes, no API tokens, no
# misleading green check on every commit. The maintainer can still
# trigger it any time to see the stub banner (or to confirm the
# manual path works before restoring the real jobs).
#
# To re-enable for automatic runs:
# 1. Re-add `push: branches: [main]` to `on:` above (parity with
#    PR #525).
# 2. Replace the `disabled-stub` job with the original
#    `preflight-deepseek` + `test-ignored-deepseek` jobs from PR #525.
# 3. Drop the `if: false` lines on `preflight-deepseek` /
#    `test-discover-deepseek` / `discover-deepseek` in
#    `e2e-network.yml` (also deleted on 2026-08-19; restore from
#    PR #525 + PR #529).
#
# History:
# - PR #525 (2026-08-16): introduced as post-merge informative workflow
# - PR #529 (2026-08-17): stubbed because budget still exhausted
# - PR #XXX (2026-08-19): removed auto-trigger on push; manual-only

concurrency:
  group: test-ignored-deepseek-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  disabled-stub:
    name: 'DISABLED — DeepSeek budget exhausted'
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: skip with explanation
        run: |
          echo "================================================================"
          echo "DISABLED: test-ignored-deepseek is currently a stub."
          echo "Reason: native DeepSeek pay-as-you-go budget exhausted."
          echo "Auto-trigger on push to main was removed on 2026-08-19; this"
          echo "workflow now runs only on manual dispatch."
          echo "To re-enable: restore the original jobs from PR #525 and"
          echo "re-add `push: branches: [main]` to `on:` above."
          echo "================================================================"
          exit 0
