name: test-ignored-opencode-go

on:
  push:
    branches: [main]
  workflow_dispatch:

# DISABLED 2026-08-19: OpenCode Go (`OPENCODE_GO_API_KEY`) budget exhausted
# / key not available on the runner (per docs/pending-items-2026-08-13.md
# §9.3). This workflow was introduced in PR #525 (Z1 restructure) but the
# upstream budget never recovered. Left active, the job would only print
# `SKIP` on every push to main with no coverage value.
# To re-enable: replace this stub with the original preflight-opencode_go +
# test-ignored-opencode-go jobs from PR #525, and remove the `if: ${{ always() }}`
# on the stub job below.
#
# History:
# - PR #525 (2026-08-16): introduced as post-merge informative workflow
# - PR #XXX (2026-08-19): stubbed to mirror the test-ignored-deepseek stub
#   from PR #529 (native DeepSeek budget exhausted)

concurrency:
  group: test-ignored-opencode-go-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  disabled-stub:
    name: 'DISABLED — OpenCode Go budget exhausted'
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: skip with explanation
        run: |
          echo "================================================================"
          echo "DISABLED: test-ignored-opencode-go is currently a stub."
          echo "Reason: native OpenCode Go (OPENCODE_GO_API_KEY) budget exhausted."
          echo "To re-enable: restore the original jobs from PR #525."
          echo "================================================================"
          exit 0
