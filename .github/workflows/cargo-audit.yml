name: cargo-audit

on:
  # PRs and pushes run the audit only when the dependency graph or the
  # audit setup changes. A RustSec advisory published overnight is not
  # a property of an unrelated PR, so it should not turn that PR red;
  # the nightly run below reports it instead.
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/audit.toml'
      - '.github/workflows/cargo-audit.yml'
      - 'scripts/cargo-audit-issue.sh'
  pull_request:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/audit.toml'
      - '.github/workflows/cargo-audit.yml'
      - 'scripts/cargo-audit-issue.sh'
  schedule:
    # Nightly cadence so the advisory graph tracks RustSec in near
    # real-time. This run does NOT fail on advisories: it keeps one
    # tracking issue ("cargo-audit: RustSec advisories on main") up to
    # date instead, so one advisory is one notification, not one red
    # run per day until it is fixed. It still fails when the tool
    # itself breaks (no valid report).
    - cron: '37 5 * * *'
  workflow_dispatch:
    inputs:
      track_issue:
        description: 'Report advisories in the tracking issue instead of failing (what the nightly run does)'
        type: boolean
        default: false

# Serialize concurrent runs in FIFO order — do NOT cancel in-flight or
# pending runs. Per ADR-0011 no workflow in this repo sets
# `cancel-in-progress: true`. cargo-audit makes no upstream API calls
# (it queries the public RustSec DB); the value is backpressure against
# parallel scan storms. See issue #742 and ADR-0011.
concurrency:
  group: cargo-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
  queue: max

# Read-only token. We only fetch public advisory data and read Cargo.lock.
permissions:
  contents: read
  checks: write
  # The nightly run creates, updates and closes the tracking issue.
  issues: write

jobs:
  audit:
    name: 'cargo-audit · RustSec advisories'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.97.1

      - name: Install cargo-audit
        uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        with:
          tool: cargo-audit

      - name: Run cargo audit (JSON)
        id: audit
        # Nightly (and `track_issue` dispatch) runs report through the
        # tracking issue, so a matched advisory must not fail the job
        # here. The next step still fails it when no valid report was
        # written.
        continue-on-error: ${{ github.event_name == 'schedule' || inputs.track_issue == true }}
        # `--json` writes a stable report to stdout that we capture for the
        # artifact. The job's verdict is cargo-audit's own exit code
        # (non-zero when any advisory matches `Cargo.lock`, dev-dependencies
        # included: the JSON carries no dependency-kind field to filter
        # on). The fetch is kept (no `--no-fetch`) so the nightly cron uses
        # the latest DB.
        #
        # Report shape: `.vulnerabilities.found` is a BOOLEAN and the
        # records live in `.vulnerabilities.list`, so the artifact lists
        # one `{id, crate, version, title, patched}` row per advisory.
        # Before, `jq` read `.found` and always wrote an empty list next
        # to a non-zero `count`.
        #
        # Only stdout goes to `jq`: stderr (advisory-DB fetch progress)
        # stays in the job log. Merging it into the pipe broke the parse
        # with `jq: parse error` on trunk run 37253650633 (#997).
        run: |
          set -o pipefail
          cargo audit --json \
            | tee audit.raw.json \
            | jq '{ vulnerabilities: { count: (.vulnerabilities.count // 0), list: [ (.vulnerabilities.list // [])[] | { id: .advisory.id, crate: .package.name, version: .package.version, title: .advisory.title, patched: .versions.patched } ] } }' \
            > audit.json

      - name: Write job summary
        if: ${{ !cancelled() && hashFiles('audit.json') != '' }}
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$(jq -r '.vulnerabilities.count // 0' audit.json)" -gt 0 ]; then
            bash scripts/cargo-audit-issue.sh body audit.json "$RUN_URL" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No RustSec advisory matches Cargo.lock.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Sync the tracking issue
        if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.track_issue == true) }}
        # Exit 2 (invalid report) keeps the run red: a broken tool must
        # not read as "no advisories". Behaviour table and spec:
        # scripts/cargo-audit-issue.sh, scripts/test-cargo-audit-issue.sh.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash scripts/cargo-audit-issue.sh sync audit.json "$RUN_URL"

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cargo-audit-report
          path: audit.json
          retention-days: 14
          if-no-files-found: warn
