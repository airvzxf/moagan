name: cargo-audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly cadence so the advisory graph tracks RustSec in near real-time.
    - cron: '37 5 * * *'
  workflow_dispatch:

# Read-only token. We only fetch public advisory data and read Cargo.lock.
permissions:
  contents: read

jobs:
  audit:
    name: 'cargo-audit · RustSec advisories'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.97.1

      - name: Install cargo-audit
        uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        with:
          tool: cargo-audit

      - name: Run cargo audit (JSON)
        # `--json` writes a stable report to stdout that we capture for the
        # artifact. `--no-dev` was removed in cargo-audit 0.21 (May 2024);
        # we now drop dev-dependency advisories from the JSON via `jq`
        # (`package.kind == "dev-dependency"` is the discriminator). The
        # fetch is kept (no `--no-fetch`) so the nightly cron uses the
        # latest DB.
        #
        # Note on `.vulnerabilities.found`: recent cargo-audit (>=0.21)
        # returns this field as a BOOLEAN (`true` when at least one
        # vulnerability exists) instead of an array of records, with the
        # actual list moved into `.vulnerabilities.list`. The map/select
        # pipeline below treats anything that isn't an array as an empty
        # list so both the boolean and the array shape pass through
        # without `jq: Cannot iterate over boolean (true)`. The `count`
        # field is always numeric and is the source of truth for the
        # non-zero advisory case.
        run: |
          set -o pipefail
          cargo audit --json 2>&1 \
            | tee audit.raw.json \
            | jq '{ vulnerabilities: { found: (((.vulnerabilities.found // []) | if type == "array" then map(select(.package.kind != "dev-dependency")) else [] end)), count: (.vulnerabilities.count // 0) } }' \
            > audit.json

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cargo-audit-report
          path: audit.json
          retention-days: 14
          if-no-files-found: warn
