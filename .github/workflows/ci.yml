name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: [self-hosted, Linux, X64, moagan]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          cargo --version
          rustc --version
          clippy-driver --version
          mold --version

      - name: Guard against forbidden crates
        run: make guard-deps

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all-targets

      - name: Build
        run: cargo build --release

      - name: Documentation
        run: cargo doc --no-deps
