name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: [self-hosted, Linux, X64, moagan]
    timeout-minutes: 30
    env:
      CARGO_BUILD_RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          cargo --version
          rustc --version
          clippy-driver --version
          mold --version

      - name: Cache cargo target
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-moagan-target-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-moagan-target-

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run validation gauntlet
        run: |
          set -euo pipefail
          make fmt-check
          make guard-deps
          make lint
          cargo test --all-targets -- --skip audit_e2e_deep_run_has_exact_external_coverage
          make build
