name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Two jobs reflect the tiered validation model documented in
# docs/validation-tiers.md:
#   lint-test-build  → T0 + T1 + T2  (fmt-check, guard-deps, lint, build, test)
#   smoke-e2e        → T3            (static smoke gates + local e2e against mock)
# Both must be green for branch protection to allow merge to main.
# Required check names (for branch protection required_status_checks.contexts):
#   - lint-test-build
#   - smoke-e2e
#
# Runs on GitHub-hosted ubuntu-latest (was self-hosted vps-ccx13-runner before
# commit 5f75000; restored so CI can run without a registered runner image).
# The Makefile test-ci target mirrors the --skip flags applied below so local
# pre-push and CI agree on the test set.

jobs:
  lint-test-build:
    name: "Tier 2 · lint + test + build"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Show toolchain
        run: |
          cargo --version
          rustc --version
          clippy-driver --version

      - name: T0 · fmt-check + guard-deps
        run: |
          set -euo pipefail
          make fmt-check
          make guard-deps

      - name: T1 · lint + build
        run: |
          set -euo pipefail
          make lint
          make build

      - name: T2 · cargo test
        run: |
          set -euo pipefail
          cargo test --all-targets -- \
            --skip audit_e2e_deep_run_has_exact_external_coverage \
            --skip cli::diff::tests::diff_unknown_run_returns_invalid_state

  smoke-e2e:
    name: "Tier 3 · smoke + e2e"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Show toolchain
        run: |
          cargo --version
          rustc --version

      - name: T3 · smoke (static, <2 s)
        run: make smoke

      - name: T3 · e2e local (mock pipeline, ~1 min)
        run: make e2e