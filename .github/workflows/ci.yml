name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel previous runs on the same PR / branch when a new commit lands.
# Saves minutes on iterative PRs (re-fix typo, re-push → previous run killed).
# This is the ONLY workflow in the repo with cancel-in-progress: true;
# the post-merge test-ignored-{minimax,opencode,deepseek}.yml and
# e2e-network*.yml workflows deliberately set it to false + queue: max
# (closes #738) so a long real-LLM run is not killed mid-flight, which
# would waste the upstream token spend AND mark the previous commit as
# red on the commit page (cancelled runs render as failed checks).
# Safe here because the ci.yml jobs use the mock LLM provider and have
# no upstream cost; their wall-clock (~6 min cold / ~3 min warm) is
# short enough that cancelling on push is the right PR-iteration UX.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Minimum token permissions: only read repo contents. Each job may further
# escalate (none currently do). Combined with the repo-level Actions policy
# (`default_workflow_permissions: read`) this caps the blast radius of a
# compromised third-party action.
permissions:
  contents: read

# Tiered validation as documented in AGENTS.md §"Validation tiers", but split into
# 7 round-2 jobs to maximise wall-clock parallelism. The dependency graph:
#
#   fmt-check              ─┐
#   guard-deps             ─┤   T0 (no deps, <2 s each)
#                           │
#   clippy                 ─┤   T1 (no deps, ~60 s)
#                           │
#   test-tests             ─┤
#   test-lib               ─┤   T2/T3 (no inter-job deps)
#   smoke                  ─┤
#   e2e                    ─┤
#   test-doc               ─┘
#
# The --ignored deepseek, opencode, and minimax discovery tests live in
# dedicated post-merge workflows (`.github/workflows/test-ignored-deepseek.yml`,
# `.github/workflows/test-ignored-opencode.yml`,
# `.github/workflows/test-ignored-minimax.yml`). They trigger only on push to
# main and on workflow_dispatch — never on PRs — to (a) reduce per-PR runner
# cost, (b) eliminate refs/pull/N/merge cache pollution from Swatinem/rust-cache,
# and (c) align with the existing e2e-network post-merge pattern. No
# real-provider network test runs in this workflow.
#
# As of 2026-08-28, `test-ignored-deepseek` remains a disabled stub (the
# native deepseek pay-as-you-go budget was exhausted on 2026-08-15 and
# was restored on 2026-08-28; see `docs/pending-items-2026-08-13.md §9.3`,
# PR #529, and the v0.12.12 §2.3 audit). `test-ignored-opencode` was
# restored to an active workflow on 2026-08-19 (PR #555); it runs the
# real `--ignored` discovery test whenever an operator dispatches it
# manually from the Actions tab. `test-ignored-minimax` still runs the
# real `--ignored` discovery test on every push to main.
#
# Wall-clock critical path:
#   round 1 = max(fmt-check, guard-deps, clippy)                       ~60 s
#   round 2 = max(test-lib, test-tests, test-doc, smoke, e2e)          ~5 min
# Total: ~6 min cold / ~3 min warm.
#
# Required check names (must match the ruleset `protect-main` rule
# `required_status_checks.required_status_checks[].context`):
#   - fmt-check
#   - guard-deps
#   - clippy
#   - test-lib
#   - test-tests
#   - test-doc
#   - smoke
#   - e2e
#
# All 8 checks are hard gates. The post-merge
# `test-ignored-deepseek` / `test-ignored-opencode` / `test-ignored-minimax`
# workflows are not part of the required status checks at all — they trigger
# on every push to main for regression visibility. `test-ignored-minimax`
# runs the real `--ignored` discovery test (gated on `MINIMAX_API_KEY`);
# `test-ignored-opencode` runs the same on manual dispatch (gated on
# `OPENCODE_API_KEY`); `test-ignored-deepseek` is the remaining disabled
# stub (see comment block above and `docs/pending-items-2026-08-13.md §9.3`).
#
# `e2e-network` is NOT in the required list (it runs only post-merge on main).

jobs:
  fmt-check:
    name: 'T0 · fmt-check'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/rust-setup
        with:
          components: rustfmt
      - run: make fmt-check

  guard-deps:
    name: 'T0 · guard-deps'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/rust-setup
      - run: make guard-deps

  clippy:
    name: 'T1 · clippy'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/rust-setup
        with:
          components: clippy
      - run: make lint

  test-tests:
    name: 'T2 · cargo test --tests (integration)'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/rust-setup
        with:
          components: rustfmt,clippy
      - name: Pin MOAGAN_HOME under workspace for artifact capture
        if: always()
        run: echo "MOAGAN_HOME=$GITHUB_WORKSPACE/.moagan-home" >> "$GITHUB_ENV"
      - name: prepare logs directory
        run: mkdir -p logs
      - name: cargo test (integration suite)
        run: |
          bash -c '
          cargo test --tests --no-fail-fast
          ' > logs/${{ github.job }}-stdout.log 2> logs/${{ github.job }}-stderr.log
      - name: gzip captured logs
        if: always()
        run: |
          gzip -9 -f logs/${{ github.job }}-stdout.log logs/${{ github.job }}-stderr.log || true
          ls -la logs/ || true
      - name: upload moagan jsonl artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: moagan-jsonl-${{ github.job }}
          path: |
            ${{ env.MOAGAN_HOME }}/.runs/**/*.jsonl.gz
            ${{ env.MOAGAN_HOME }}/.runs/**/*.jsonl
            target/test-runs/**/*.jsonl.gz
            target/test-runs/**/*.jsonl
          retention-days: 7
          if-no-files-found: warn
      - name: upload moagan stdout artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: moagan-${{ github.job }}-stdout
          path: logs/${{ github.job }}-stdout.log.gz
          retention-days: 7
          if-no-files-found: warn
      - name: upload moagan stderr artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: moagan-${{ github.job }}-stderr
          path: logs/${{ github.job }}-stderr.log.gz
          retention-days: 7
          if-no-files-found: warn
      - name: print artifact hint on failure
        if: failure()
        run: |
          echo "::error::Moagan run failed in '${{ github.job }}'. Full stdout is in the 'moagan-${{ github.job }}-stdout' artifact and full stderr is in 'moagan-${{ github.job }}-stderr' (retention: 7 days)."

  test-lib:
    name: 'T2 · cargo test --lib --bins'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/rust-setup
        with:
          components: rustfmt,clippy
      - name: Pin MOAGAN_HOME under workspace for artifact capture
        if: always()
        run: echo "MOAGAN_HOME=$GITHUB_WORKSPACE/.moagan-home" >> "$GITHUB_ENV"
      - name: prepare logs directory
        run: mkdir -p logs
      - name: cargo test (lib + bins)
        run: |
          bash -c '
          cargo test --lib --bins --no-fail-fast
          ' > logs/${{ github.job }}-stdout.log 2> logs/${{ github.job }}-stderr.log
      - name: gzip captured logs
        if: always()
        run: |
          gzip -9 -f logs/${{ github.job }}-stdout.log logs/${{ github.job }}-stderr.log || true
          ls -la logs/ || true
      - name: upload moagan jsonl artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: moagan-jsonl-${{ github.job }}
          path: |
            ${{ env.MOAGAN_HOME }}/.runs/**/*.jsonl.gz
            ${{ env.MOAGAN_HOME }}/.runs/**/*.jsonl
            target/test-runs/**/*.jsonl.gz
            target/test-runs/**/*.jsonl
          retention-days: 7
          if-no-files-found: warn
      - name: upload moagan stdout artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: moagan-${{ github.job }}-stdout
          path: logs/${{ github.job }}-stdout.log.gz
          retention-days: 7
          if-no-files-found: warn
      - name: upload moagan stderr artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: moagan-${{ github.job }}-stderr
          path: logs/${{ github.job }}-stderr.log.gz
          retention-days: 7
          if-no-files-found: warn
      - name: print artifact hint on failure
        if: failure()
        run: |
          echo "::error::Moagan run failed in '${{ github.job }}'. Full stdout is in the 'moagan-${{ github.job }}-stdout' artifact and full stderr is in 'moagan-${{ github.job }}-stderr' (retention: 7 days)."

  smoke:
    name: 'T3 · make smoke'
    runs-on: ubuntu-latest
    # Bumped 5 → 10 min after PR #544 (rate-limiter-scale) timed
    # out at 5m00s on its first CI run. Locally the smoke suite
    # finishes in ~30 s; the cold-runner + shared-cache penalty is
    # what eats the budget. 10 min is the lowest multiple of 5 that
    # gives the runner headroom on a degraded upstream without
    # silently hiding a real regression.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/rust-setup
      - name: Pin MOAGAN_HOME under workspace for artifact capture
        if: always()
        run: echo "MOAGAN_HOME=$GITHUB_WORKSPACE/.moagan-home" >> "$GITHUB_ENV"
      - name: prepare logs directory
        run: mkdir -p logs
      - name: cargo build (debug, for smoke + e2e binaries)
        run: |
          bash -c '
          cargo build --locked
          ' > logs/${{ github.job }}-stdout.log 2> logs/${{ github.job }}-stderr.log
      - name: make smoke
        run: |
          bash -c '
          make smoke
          ' >> logs/${{ github.job }}-stdout.log 2>> logs/${{ github.job }}-stderr.log
      - name: gzip captured logs
        if: always()
        run: |
