name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Per maintainer policy (ADR-0011), no workflow in this repo cancels
# in-flight runs on a new push/PR. The group is keyed on run_id (with
# the workflow-name prefix matching e2e-network*.yml's convention) so
# every push becomes its own concurrency group; nothing cancels,
# nothing queues behind an in-flight run. Trade-off: a 4-push PR
# iteration runs CI ~4× in parallel instead of cancelling each prior
# run; the wall-clock cost is bounded by runner quota, not by upstream
# token spend (ci.yml uses the mock LLM provider with no upstream
# billing). The audit trail stays clean — every commit's checks show
# their true conclusion, never a "cancelled" red ❌ from a follow-up push.
concurrency:
  group: ci-${{ github.run_id }}
  cancel-in-progress: false

# Minimum token permissions: only read repo contents. Each job may further
# escalate (none currently do). Combined with the repo-level Actions policy
# (`default_workflow_permissions: read`) this caps the blast radius of a
# compromised third-party action.
permissions:
  contents: read
  checks: write

# Tiered validation as documented in AGENTS.md §"Validation tiers", but
# split into 8 round-2 jobs to maximise wall-clock parallelism. The
# dependency graph:
#
#   fmt-check              ─┐
#   guard-deps             ─┤   T0 (no deps, <2 s each)
#                           │
#   clippy                 ─┤   T1 (no deps, ~60 s)
#                           │
#   test-tests             ─┤
#   test-lib               ─┤   T2/T3 (no inter-job deps)
#   smoke                  ─┤
#   e2e                    ─┤
#   test-doc               ─┘
#
#   cache-warm                  main only, not a required check
#
# The --ignored minimax discovery test lives in a dedicated post-merge
# workflow (`.github/workflows/test-ignored-minimax.yml`). It triggers
# only on push to main and on workflow_dispatch — never on PRs — to
# (a) reduce per-PR runner cost, (b) eliminate refs/pull/N/merge cache
# pollution from Swatinem/rust-cache, and (c) align with the existing
# e2e-network post-merge pattern. No real-provider network test runs in
# this workflow.
#
# As of v0.16.0 (EPIC #851 — drop OpenCode+DeepSeek from CI
# infrastructure), the OpenCode and DeepSeek counterparts
# (`test-ignored-opencode.yml`, `test-ignored-deepseek.yml`) are
# deleted. See `docs/adr/0008-ci-uses-minimax-only.md` for rationale.
#
# Cache (ADR-0014): every job restores the `moagan-dev` rust-cache
# entry and none of the 8 gated jobs saves it. The ninth job,
# `cache-warm`, runs only on main, builds the superset of dependencies
# the other jobs need (build, test, clippy, docgen) and is the single
# writer of `moagan-dev`. It skips its builds on an exact hit, so it
# compiles only when Cargo.lock, Cargo.toml or the toolchain changed.
# Pull requests read main's entry and leave nothing behind;
# `cleanup-actions-cache.yml` drops superseded entries.
# The duplicated `cargo test + gzip + upload-artifact` block is
# extracted into `.github/actions/cargo-test-with-artifacts/`
# (closes #824).
#
# Wall-clock critical path:
#   round 1 = max(fmt-check, guard-deps, clippy)                       ~60 s
#   round 2 = max(test-lib, test-tests, test-doc, smoke, e2e)          ~5 min
# Total: ~6 min cold / ~3 min warm.
#
# Required check names (must match the ruleset `protect-main` rule
# `required_status_checks.required_status_checks[].context`):
#   - fmt-check
#   - guard-deps
#   - clippy
#   - test-lib
#   - test-tests
#   - test-doc
#   - smoke
#   - e2e
#
# All 8 checks are hard gates. The post-merge `test-ignored-minimax`
# workflow is not part of the required status checks at all — it triggers
# on every push to main for regression visibility. `test-ignored-minimax`
# runs the real `--ignored` discovery test (gated on `MINIMAX_API_KEY`).
# The OpenCode and DeepSeek siblings were removed in v0.16.0
# (EPIC #851).
#
# `e2e-network` is NOT in the required list (it runs only post-merge on main).
# `cache-warm` is NOT in the required list (it never runs on a PR).

jobs:
  cache-warm:
    name: 'Cache · warm moagan-dev (main only)'
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - id: setup
        uses: ./.github/actions/rust-setup
        with:
          components: clippy
          shared-key: moagan-dev
          save-cache: 'true'
      # Each command below compiles the dependency set of one kind of
      # job: `cargo build` (smoke, e2e), `cargo test` (test-*, test-doc,
      # test-ignored), `cargo clippy` (clippy, smoke) and the docgen
      # binary (*-doc-sync). On an exact hit the entry already holds
      # them and rust-cache would not save again, so the builds are
      # skipped.
      - name: Build dependencies (build, test, clippy, docgen)
        if: steps.setup.outputs.cache-hit != 'true'
        run: |
          cargo build --locked
          cargo test --locked --all-targets --no-run
          cargo clippy --locked --all-targets --features dev-tools
          cargo build --locked --features dev-tools --bin moagan-docgen

  fmt-check:
    name: 'T0 · fmt-check'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/rust-setup
        with:
          components: rustfmt
          shared-key: moagan-dev
      - run: make fmt-check

  guard-deps:
    name: 'T0 · guard-deps'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/rust-setup
        with:
          shared-key: moagan-dev
      - run: make guard-deps

  clippy:
    name: 'T1 · clippy'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/rust-setup
        with:
          components: clippy
          shared-key: moagan-dev
      - run: make lint

  test-tests:
    name: 'T2 · cargo test --tests (integration)'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/rust-setup
        with:
          components: rustfmt,clippy
          shared-key: moagan-dev
      - uses: ./.github/actions/cargo-test-with-artifacts
        with:
          cargo-args: '--tests --no-fail-fast'
          extra-env: '1'

  test-lib:
    name: 'T2 · cargo test --lib --bins'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/rust-setup
        with:
          components: rustfmt,clippy
          shared-key: moagan-dev
      - uses: ./.github/actions/cargo-test-with-artifacts
        with:
          cargo-args: '--lib --bins --no-fail-fast'
          extra-env: '1'

  smoke:
    name: 'T3 · make smoke'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/rust-setup
        with:
          # smoke_audit_proxy.sh (part of `make smoke`, #1008) runs
          # `cargo fmt --check` and `cargo clippy`.
          components: rustfmt,clippy
          shared-key: moagan-dev
      - name: cargo build (debug)
        shell: bash
        run: cargo build --locked
      - uses: ./.github/actions/cargo-test-with-artifacts
        with:
          run-script: 'make smoke'

  e2e:
    name: 'T3 · make e2e (local mock pipeline)'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/rust-setup
        with:
          shared-key: moagan-dev
      - name: cargo build (debug)
        shell: bash
        run: cargo build --locked
      - uses: ./.github/actions/cargo-test-with-artifacts
        with:
          run-script: 'make e2e'

  test-doc:
    name: 'T2 · cargo test --doc'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/rust-setup
        with:
          components: rustfmt,clippy
          shared-key: moagan-dev
      - uses: ./.github/actions/cargo-test-with-artifacts
        with:
          cargo-args: '--doc'
          extra-env: '1'
