          path: |
            ${{ env.MOAGAN_HOME }}/.runs/**/*.jsonl.gz
            ${{ env.MOAGAN_HOME }}/.runs/**/*.jsonl
            target/test-runs/**/*.jsonl.gz
            target/test-runs/**/*.jsonl
          retention-days: 7
          if-no-files-found: warn
      - name: upload moagan stdout artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: moagan-${{ github.job }}-stdout
          path: logs/${{ github.job }}-stdout.log.gz
          retention-days: 7
          if-no-files-found: warn
      - name: upload moagan stderr artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: moagan-${{ github.job }}-stderr
          path: logs/${{ github.job }}-stderr.log.gz
          retention-days: 7
          if-no-files-found: warn
      - name: print artifact hint on failure
        if: failure()
        run: |
          echo "::error::Moagan run failed in '${{ github.job }}'. Full stdout is in the 'moagan-${{ github.job }}-stdout' artifact and full stderr is in 'moagan-${{ github.job }}-stderr' (retention: 7 days)."

  e2e:
    name: 'T3 · make e2e (local mock pipeline)'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/rust-setup
      - name: Pin MOAGAN_HOME under workspace for artifact capture
        if: always()
        run: echo "MOAGAN_HOME=$GITHUB_WORKSPACE/.moagan-home" >> "$GITHUB_ENV"
      - name: prepare logs directory
        run: mkdir -p logs
      - name: cargo build (debug, for smoke + e2e binaries)
        run: |
          bash -c '
          cargo build --locked
          ' > logs/${{ github.job }}-stdout.log 2> logs/${{ github.job }}-stderr.log
      - name: make e2e
        run: |
          bash -c '
          make e2e
          ' >> logs/${{ github.job }}-stdout.log 2>> logs/${{ github.job }}-stderr.log
      - name: gzip captured logs
        if: always()
        run: |
          gzip -9 -f logs/${{ github.job }}-stdout.log logs/${{ github.job }}-stderr.log || true
          ls -la logs/ || true
      - name: upload moagan jsonl artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: moagan-jsonl-${{ github.job }}
          path: |
            ${{ env.MOAGAN_HOME }}/.runs/**/*.jsonl.gz
            ${{ env.MOAGAN_HOME }}/.runs/**/*.jsonl
            target/test-runs/**/*.jsonl.gz
            target/test-runs/**/*.jsonl
          retention-days: 7
          if-no-files-found: warn
      - name: upload moagan stdout artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: moagan-${{ github.job }}-stdout
          path: logs/${{ github.job }}-stdout.log.gz
          retention-days: 7
          if-no-files-found: warn
      - name: upload moagan stderr artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: moagan-${{ github.job }}-stderr
          path: logs/${{ github.job }}-stderr.log.gz
