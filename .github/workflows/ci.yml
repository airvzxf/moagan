name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel previous runs on the same PR / branch when a new commit lands.
# Saves minutes on iterative PRs (re-fix typo, re-push → previous run killed).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Minimum token permissions: only read repo contents. Each job may further
# escalate (none currently do). Combined with the repo-level Actions policy
# (`default_workflow_permissions: read`) this caps the blast radius of a
# compromised third-party action.
permissions:
  contents: read

# Tiered validation as documented in docs/validation-tiers.md, but split into
# 9 parallel jobs to maximise wall-clock parallelism. The dependency graph:
#
#   fmt-check    ─┐
#   guard-deps   ─┤   T0 (no deps, <2 s each)
#                   │
#   clippy       ─┤   T1 (no deps, ~60 s)
#   build-ci     ─┴─► upload-artifact: moagan-debug
#                       │
#   test-tests   ────┐
#   test-lib     ────┤
#   test-doc     ────┤  T2 (depend on build-ci, parallel)
#   smoke        ────┤
#   e2e          ────┘
#
# All 5 post-build jobs run in parallel and only depend on `build-ci`. The
# YAML declaration order is: test-tests, test-lib, smoke, e2e, test-doc.
# This is purely a visual ordering in the GitHub Actions UI; the actual
# execution is parallel and the wall-clock critical path is dominated by
# the slowest of the 5 jobs (typically e2e at ~3 min).
#
# Wall-clock critical path:
#   round 1 = max(fmt-check, guard-deps, clippy, build-ci)                  ~60 s
#   round 2 = max(test-lib, test-tests, test-doc, smoke, e2e)             ~3 min
# Total: ~4 min cold / ~2 min warm (vs. ~5-8 min before this refactor).
#
# Note on artifact sharing:
#   We tried to share the built binary between `build-ci` and the
#   consumers (smoke, e2e) via actions/upload-artifact + download-artifact.
#   The v4 actions preserve the file's relative path inside the zip
#   (the zip contains `target/debug/moagan`), and download-artifact
#   extracts the zip with that internal structure preserved. Two
#   attempts to fix the path (`path: target/debug` and `path: workspace`)
#   placed the file at the wrong location and the consumers' hard-coded
#   `${ROOT}/target/debug/moagan` did not find it. Removed artifact
#   sharing; consumers run `cargo build` themselves. Swatinem/rust-cache
#   shares `target/` across all jobs in the same workflow, so the
#   consumer rebuild is incremental (just relink) and costs ~5-15 s.
#
# Required check names (must match the ruleset `protect-main` rule
# `required_status_checks.required_status_checks[].context`):
#   - fmt-check
#   - guard-deps
#   - clippy
#   - build-ci
#   - test-lib
#   - test-tests
#   - test-doc
#   - smoke
#   - e2e
#
# `e2e-network` is NOT in the required list (it runs only post-merge on main).

jobs:
  fmt-check:
    name: 'T0 · fmt-check'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/rust-setup
        with:
          components: rustfmt
      - run: make fmt-check

  guard-deps:
    name: 'T0 · guard-deps'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/rust-setup
      - run: make guard-deps

  clippy:
    name: 'T1 · clippy'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/rust-setup
        with:
          components: clippy
      - run: make lint

  build-ci:
    name: 'T1 · build (populates cargo cache)'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/rust-setup
      - name: cargo build (debug)
        run: cargo build --locked

  test-tests:
    name: 'T2 · cargo test --tests (integration)'
    needs: build-ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/rust-setup
        with:
          components: rustfmt,clippy
      - name: cargo test (integration suite)
        run: cargo test --tests --no-fail-fast

  test-lib:
    name: 'T2 · cargo test --lib --bins'
    needs: build-ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/rust-setup
        with:
          components: rustfmt,clippy
      - name: cargo test (lib + bins)
        run: cargo test --lib --bins --no-fail-fast

  smoke:
    name: 'T3 · make smoke'
    needs: build-ci
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/rust-setup
      - name: cargo build (debug, for smoke + e2e binaries)
        run: cargo build --locked
      - name: make smoke
        run: make smoke

  e2e:
    name: 'T3 · make e2e (local mock pipeline)'
    needs: build-ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/rust-setup
      - name: cargo build (debug, for smoke + e2e binaries)
        run: cargo build --locked
      - name: make e2e
        run: make e2e

  test-doc:
    name: 'T2 · cargo test --doc'
    needs: build-ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/rust-setup
      - name: cargo test --doc
        run: cargo test --doc
