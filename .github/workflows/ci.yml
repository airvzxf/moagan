name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel previous runs on the same PR / branch when a new commit lands.
# Saves minutes on iterative PRs (re-fix typo, re-push → previous run killed).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Minimum token permissions: only read repo contents. Each job may further
# escalate (none currently do). Combined with the repo-level Actions policy
# (`default_workflow_permissions: read`) this caps the blast radius of a
# compromised third-party action.
permissions:
  contents: read

# Tiered validation as documented in docs/validation-tiers.md, but split into
# 9 parallel jobs to maximise wall-clock parallelism. The dependency graph:
#
#   fmt-check    ─┐
#   guard-deps   ─┤   T0 (no deps, <2 s each)
#                 │
#   clippy       ─┤   T1 (no deps, ~60 s)
#                 │
#   test-tests   ─┤
#   test-lib     ─┤
#   test-doc     ─┤   T2 (no deps, parallel)
#   test-ignored ─┤
#   smoke        ─┤
#   e2e          ─┘
#
#
# The YAML declaration order is: test-tests, test-ignored, test-lib, smoke, e2e, test-doc.
# This is purely a visual ordering in the GitHub Actions UI; the actual
# execution is parallel and the wall-clock critical path is dominated by
# the slowest of the 6 round-2 jobs (typically e2e at ~3 min).
#
# Wall-clock critical path:
#   round 1 = max(fmt-check, guard-deps, clippy)                                     ~60 s
#   round 2 = max(test-lib, test-tests, test-doc, test-ignored, smoke, e2e)          ~3 min
# Total: ~4 min cold / ~2 min warm (vs. ~5-8 min before this refactor).
#
# Required check names (must match the ruleset `protect-main` rule
# `required_status_checks.required_status_checks[].context`):
#   - fmt-check
#   - guard-deps
#   - clippy
#   - test-lib
#   - test-tests
#   - test-doc
#   - smoke
#   - e2e
#
# `e2e-network` is NOT in the required list (it runs only post-merge on main).

jobs:
  fmt-check:
    name: 'T0 · fmt-check'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/rust-setup
        with:
          components: rustfmt
      - run: make fmt-check

  guard-deps:
    name: 'T0 · guard-deps'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/rust-setup
      - run: make guard-deps

  clippy:
    name: 'T1 · clippy'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/rust-setup
        with:
          components: clippy
      - run: make lint

  test-tests:
    name: 'T2 · cargo test --tests (integration)'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/rust-setup
        with:
          components: rustfmt,clippy
      - name: cargo test (integration suite)
        run: cargo test --tests --no-fail-fast

  test-ignored:
    name: 'T2 · cargo test -- --ignored (gated on secrets)'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/rust-setup
        with:
          components: rustfmt,clippy
      - name: cargo test -- --ignored (gated on secrets)
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set +e  # don't fail the whole CI if a gate is missing
          ARGS=""
          if [[ -n "${OPENCODE_GO_API_KEY:-}" ]]; then
            ARGS="$ARGS --test integration_discover_opencode_go"
          fi
          if [[ -n "${DEEPSEEK_API_KEY:-}" ]]; then
            ARGS="$ARGS --test integration_discover_deepseek"
          fi
          if [[ -z "$ARGS" ]]; then
            echo "SKIP: no API-key secrets present on runner, --ignored tests not run"
            exit 0
          fi
          # Run with --ignored; --test <name> restricts which test binaries
          # are compiled and run.
          cargo test $ARGS -- --ignored

  test-lib:
    name: 'T2 · cargo test --lib --bins'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/rust-setup
        with:
          components: rustfmt,clippy
      - name: cargo test (lib + bins)
        run: cargo test --lib --bins --no-fail-fast

  smoke:
    name: 'T3 · make smoke'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/rust-setup
      - name: cargo build (debug, for smoke + e2e binaries)
        run: cargo build --locked
      - name: make smoke
        run: make smoke

  e2e:
    name: 'T3 · make e2e (local mock pipeline)'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/rust-setup
      - name: cargo build (debug, for smoke + e2e binaries)
        run: cargo build --locked
      - name: make e2e
        run: make e2e

  test-doc:
    name: 'T2 · cargo test --doc'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/rust-setup
      - name: cargo test --doc
        run: cargo test --doc
