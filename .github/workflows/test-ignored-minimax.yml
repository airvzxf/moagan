name: test-ignored-minimax

# NOTE (2026-09, see issue #761 / R2 PR #2): the `push: branches:
# [main]` block was removed. The real-LLM integration test now
# runs only when `release.yml` completes (any conclusion) via
# `.github/workflows/post-release-validation.yml` which uses
# `workflow_run: workflows: [release], types: [completed]`.
# This workflow remains as `workflow_dispatch:` for manual re-runs.
on:
  workflow_dispatch:

# Serialize concurrent runs in FIFO order — do NOT cancel in-flight or
# pending runs. The integration_discover_minimax -- --ignored test makes
# real upstream calls against https://api.minimax.io/anthropic/v1/models,
# which are billed by tokens; cancelling a run 14 min into a 16–25 min run
# discards the upstream spend AND marks the previous commit as red (the
# workflow is informational but GitHub renders cancelled runs as failures
# on the commit page). See issue #738.
#
# `cancel-in-progress: false` keeps the in-flight run alive. `queue: max`
# is the matching half: without it the default `queue: single` silently
# cancels any *pending* run when a new one lands, so a burst of 3–5
# squash-merges within the run window would still render 3–4 commits as
# cancelled (red) on the commit page. With `queue: max` GitHub keeps up
# to 100 runs pending in the group and processes them in FIFO order, so
# every commit gets exactly one real result. The artifact race the
# previous comment guarded against is still avoided because the queue is
# per-group (one runner at a time). Per ADR-0011 no workflow in this
# repo uses `cancel-in-progress: true`.
#
# Differentiate the group key by `github.event_name` so a manual
# `workflow_dispatch` does NOT queue behind a slow push run. Without
# this, `workflow_dispatch` resolves to the same key as a push
# (`…-refs/heads/main`) because `github.event.pull_request` is null on
# dispatch, and the maintainer wanting an immediate manual check would
# wait up to 25 min for the push run to finish first. The
# `pull_request.number || github.ref` fallback inside the
# non-`workflow_dispatch` branch is defensive — this workflow does not
# currently trigger on `pull_request`, but if a future PR adds it the
# key will start serializing per-PR instead of colliding per-ref
# (matches ci.yml:22). See issues #746 and #748.
concurrency:
  group: >-
    test-ignored-minimax-${{
    github.event_name == 'workflow_dispatch' && 'dispatch' ||
    github.event.pull_request.number || github.ref
    }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

# Post-merge informative validation for the MiniMax provider. Runs the
# integration_discover_minimax -- --ignored test on every push to main
# and on manual dispatch. NOT a PR gate — moved out of ci.yml to
# (a) reduce per-PR runner cost, (b) eliminate refs/pull/N/merge cache
# pollution, (c) align with the existing e2e-network post-merge pattern.
# As of v0.16.0 (EPIC #851) this is the sole remaining real-provider
# --ignored workflow; the OpenCode and DeepSeek siblings were deleted.
#
# Timeout 60 min accommodates the rare case of a degraded MiniMax
# upstream; the test itself early-returns when MINIMAX_API_KEY is
# absent so a fork PR or a runner without the secret stays green.

jobs:
  preflight-minimax:
    name: 'T3 · preflight — minimax'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: probe minimax
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        run: |
          if [[ -z "${MINIMAX_API_KEY:-}" ]]; then
            echo "SKIP: MINIMAX_API_KEY not set"
            exit 0
          fi
          echo "MINIMAX: set, length=${#MINIMAX_API_KEY}, prefix=${MINIMAX_API_KEY:0:8}...${MINIMAX_API_KEY: -4}"
          HTTP=$(timeout 30 curl -sS -o /dev/null -w '%{http_code}' \
            -H "x-api-key: $MINIMAX_API_KEY" \
            -H "anthropic-version: 2023-06-01" \
            'https://api.minimax.io/anthropic/v1/models' || echo "TIMEOUT")
          echo "MINIMAX http_status: $HTTP"
          [[ "$HTTP" =~ ^2 ]] || exit 1

  test-ignored-minimax:
    name: 'T2 · cargo test -- --ignored (minimax)'
    needs: preflight-minimax
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/rust-setup
        with:
          components: rustfmt,clippy
          # Share the rust-cache entry with the sibling opencode + deepseek
          # workflows: same Rust toolchain, same Cargo.lock, same target/.
          # Saves ~360 MB of duplicate cache and keeps cache-hit-rate high
          # across all three. See issue #747.
          shared-key: moagan-test-ignored
      - name: prepare logs directory
        run: mkdir -p logs

      - name: cargo test integration_discover_minimax -- --ignored (gated on MINIMAX_API_KEY)
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          # Opt back into incremental compilation. Swatinem/rust-cache
          # v2.9.2 unconditionally sets CARGO_INCREMENTAL=0 (its
          # src/restore.ts:30), which defeats the
          # `cache-workspace-crates: true` claim. The quoted-string `'1'`
          # is required: a bare `1` would be parsed by the runner as
          # the boolean `true`. See issue #745.
          CARGO_INCREMENTAL: '1'
        run: |
          bash -c '
          echo "============================================================"
          echo "DIAGNOSTIC HEADER"
          echo "  GitHub Actions run: $GITHUB_RUN_ID / attempt $GITHUB_RUN_ATTEMPT"
          echo "  Runner:             $(uname -a)"
          echo "  Working directory:  $(pwd)"
          echo "  Date (UTC):         $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "  Provider under test: minimax"
          echo "============================================================"
          echo "API key presence:"
          echo "  MINIMAX_API_KEY set: $([[ -n "${MINIMAX_API_KEY:-}" ]] && echo yes || echo no)"
          echo "  MINIMAX_API_KEY length: ${#MINIMAX_API_KEY} chars"
          echo "  MINIMAX_API_KEY prefix (first 8 chars, safe to echo): ${MINIMAX_API_KEY:0:8}"
          echo "  (prefix is a non-secret identifier like '"'"'eyJhbGciOi'"'"'; safe to log)"
          echo "============================================================"
          if [[ -z "${MINIMAX_API_KEY:-}" ]]; then
            echo "SKIP: MINIMAX_API_KEY not set on runner; minimax --ignored test not run"
            exit 0
          fi
          echo "Starting cargo test at $(date -u +%H:%M:%SZ)..."
          START_TS=$(date +%s)
          MOAGAN_NON_INTERACTIVE=1 cargo test --test integration_discover_minimax -- --ignored --nocapture
          CARGO_RC=$?
          END_TS=$(date +%s)
          echo "============================================================"
          echo "cargo test finished at $(date -u +%H:%M:%SZ) (wall-clock $((END_TS - START_TS))s, rc=$CARGO_RC)"
          echo "============================================================"
          exit $CARGO_RC
          ' > logs/${{ github.job }}-stdout.log 2> logs/${{ github.job }}-stderr.log

      - name: gzip captured logs
        if: always()
        run: |
          gzip -9 -f logs/${{ github.job }}-stdout.log logs/${{ github.job }}-stderr.log || true
          ls -la logs/ || true

      - name: upload test-ignored artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: moagan-test-ignored-minimax-logs
          path: target/test-runs/minimax/
          retention-days: 1
          if-no-files-found: warn

      - name: upload moagan stdout artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: moagan-${{ github.job }}-stdout
          path: logs/${{ github.job }}-stdout.log.gz
          retention-days: 7
          if-no-files-found: warn

      - name: upload moagan stderr artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: moagan-${{ github.job }}-stderr
          path: logs/${{ github.job }}-stderr.log.gz
          retention-days: 7
          if-no-files-found: warn

      - name: print artifact hint on failure
        if: failure()
        run: |
          echo "::error::Moagan run failed in '${{ github.job }}'. Full stdout is in the 'moagan-${{ github.job }}-stdout' artifact and full stderr is in 'moagan-${{ github.job }}-stderr' (retention: 7 days)."
