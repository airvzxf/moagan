name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly cadence keeps the alert graph fresh even when the repo is quiet.
    # Cron syntax follows the GitHub Actions docs (UTC).
    - cron: '17 8 * * 1'
  workflow_dispatch:

# CodeQL needs `security-events: write` to upload the SARIF bundle to the
# repository's Code scanning tab. Everything else is read-only.
permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: 'CodeQL · rust'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: ['rust']
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@c3400c2f38909e0dcf3c3a41f2030a8217be5d3e # v3
        with:
          languages: ${{ matrix.language }}
          # 'security-extended' adds the lower-severity and
          # lower-precision queries on top of the default
          # 'security-and-quality' suite. The trade-off is more
          # findings in the Security tab (most are warnings that
          # don't block merges because the alert threshold is
          # 'warning', not 'error'). The project does not enable
          # code-scanning merge protection, so the extra findings
          # are informational only.
          queries: security-extended
          # paths-ignore is NOT a top-level input of the CodeQL
          # action (per github/codeql-action init/action.yml); it
          # lives inside the `config` block which is a YAML string
          # in the same format as a codeql-config.yml file. We
          # skip:
          #   - target/**         – gitignored, defensive explicit
          #   - tests/fixtures/** – JSON mocks for the mock LLM
          #                         provider; no security surface
          #   - **/*.lock         – Cargo.lock is generated
          config: |
            paths-ignore:
              - 'target/**'
              - 'tests/fixtures/**'
              - '**/*.lock'
          # build-mode is hard-coded to `none` for Rust: the CodeQL
          # CLI (v2.26.x as of writing) does NOT support `autobuild`
          # for Rust — only `none` is accepted by the Rust extractor.
          # The init step fails with:
          #   "Rust does not support the autobuild build mode.
          #    Please try using one of the following build modes
          #    instead: none."
          # if anything else is passed. The downstream effect is
          # that the analysis is lexical / ast-only — there is no
          # dataflow pass on Rust code at this time. Findings that
          # would require dataflow (e.g. tainted input flowing
          # through src/audit/proxy.rs into the HTTP forwarder,
          # path traversal in src/audit/verify.rs) are not in
          # CodeQL's surface area; the project's own audit contract
          # tests in src/audit/ cover those instead.
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@c3400c2f38909e0dcf3c3a41f2030a8217be5d3e # v3
        with:
          # 'warning' surfaces suspicious constructs; 'error' only blocks on
          # confirmed bugs. We keep the loose threshold here so the alert
          # graph is informative without blocking the PR.
          token: ${{ secrets.GITHUB_TOKEN }}
          output: sarif-results
          category: "/language:${{ matrix.language }}"
