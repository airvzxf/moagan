name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly cadence keeps the alert graph fresh even when the repo is quiet.
    # Cron syntax follows the GitHub Actions docs (UTC).
    - cron: '17 8 * * 1'
  workflow_dispatch:

# CodeQL needs `security-events: write` to upload the SARIF bundle to the
# repository's Code scanning tab. Everything else is read-only.
permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: 'CodeQL · rust'
    runs-on: ubuntu-latest
    # Autobuild runs `cargo build` which can take 5–15 min on cold
    # cache; the analysis pass adds another 2–5 min. 45 min gives
    # comfortable headroom while still failing loudly if something
    # regresses (vs the 30 min that would mask a slow analysis as a
    # timeout).
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        language: ['rust']
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@c3400c2f38909e0dcf3c3a41f2030a8217be5d3e # v3
        with:
          languages: ${{ matrix.language }}
          # 'security-and-quality' is the default query pack from
          # https://github.com/github/codeql – it covers the lgtm.com
          # queries the public advisory database pulls from.
          queries: security-and-quality
          # Autobuild runs `cargo build` automatically for Rust
          # (CodeQL detects Cargo.toml). This unlocks dataflow
          # analysis over the actual compiled code, catching
          # issues the lexical `none` mode misses (e.g. tainted
          # data flowing into the audit proxy's HTTP forwarder,
          # path traversal in verify.rs, command injection in the
          # cgroup sandbox).
          #
          # Trade-off: autobuild takes longer than `none` because
          # the build itself runs. The 45-minute timeout above
          # accounts for both the build (5–15 min cold cache) and
          # the analysis pass (2–5 min). The shared Swatinem/rust-
          # cache from .github/actions/rust-setup keeps the cargo
          # target dir warm across jobs in this workflow.
          build-mode: autobuild

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@c3400c2f38909e0dcf3c3a41f2030a8217be5d3e # v3
        with:
          # 'warning' surfaces suspicious constructs; 'error' only blocks on
          # confirmed bugs. We keep the loose threshold here so the alert
          # graph is informative without blocking the PR.
          token: ${{ secrets.GITHUB_TOKEN }}
          output: sarif-results
          category: "/language:${{ matrix.language }}"
