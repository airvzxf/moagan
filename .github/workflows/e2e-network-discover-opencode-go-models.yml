name: e2e-network · discover_opencode_go_models (manual, ~70 min)

on:
  workflow_dispatch:

# The per-model coverage loop. 14 opencode_go aliases run sequentially
# at ~5 min each, so the ceiling is deliberately ~90 min — by far the
# longest job in the repo. It is the only thing that exercises the
# /v1/responses (gpt-5.6-luna) and /v1/messages (qwen3.*) wire formats
# against a real upstream; before it, only /v1/chat/completions had
# ever made a real request (§9.3).
#
# Extracted from e2e-network.yml on 2026-08-19 (was previously
# `workflow_dispatch`-only on the heavy workflow; now the heavy
# workflow itself doesn't carry this job). Trigger from the Actions
# tab → this workflow → "Run workflow". No inputs.
#
# Self-builds the release binary locally to avoid
# `actions/upload-artifact` retention (1 day); see
# `e2e-network-card80.yml` for the same rationale. The ~5 min cold
# build is dwarfed by the ~70 min of API spend that follows.
#
# Consumes OPENCODE_GO_API_KEY. Sets a long timeout (360 min, GitHub's
# public-repo max) because a degraded opencode_go upstream has been
# seen to triple the wall-clock.

concurrency:
  group: e2e-network-discover-opencode-go-models-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test-discover-opencode-go-models:
    name: 'Tier 3 · e2e — discover_opencode_go_models (14 models, ~70 min)'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: ./.github/actions/rust-setup

      - name: Show toolchain
        run: |
          cargo --version
          rustc --version

      - name: Build release binary
        env:
          CARGO_INCREMENTAL: '1'
        run: cargo build --release

      - name: Change to executable binary
        run: chmod +x target/release/moagan

      - name: T3 · e2e-network (discover_opencode_go_models, real LLM)
        env:
          OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
          BIN: ${{ github.workspace }}/target/release/moagan
          MOAGAN_SMOKE_SECTION: discover_opencode_go_models
        run: make e2e-network-discover-opencode-go-models
