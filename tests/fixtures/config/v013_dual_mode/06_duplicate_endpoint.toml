# Fixture: two `[[providers.opencode]]` entries with the SAME endpoint
# URL but distinct model lists. The bridge accepts both entries (no
# hard error), populates two `ProviderEntry` records with the same
# `endpoint` string, and `compute_legacy_providers` collapses them
# into a single `ProviderConfig.models` list.
#
# This fixture documents the no-op merge behaviour: the operator who
# splits the same endpoint across two entries (e.g. by mistake when
# copying an opencode roster) gets a flat model list at runtime —
# functionally equivalent to one entry holding both model sets.

[[providers.opencode]]
endpoint = "https://opencode.ai/zen/go/v1/chat/completions"
models = ["kimi-k3", "glm-5.1"]

[[providers.opencode]]
endpoint = "https://opencode.ai/zen/go/v1/chat/completions"
models = ["deepseek-v4-flash", "mimo-v2.5"]
temperature = 1.0