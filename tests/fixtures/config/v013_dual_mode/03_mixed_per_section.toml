# Fixture: mixed per-section. `[providers.minimax]` stays in the legacy
# single-table form (warns), `[[providers.deepseek]]` uses the new
# array-of-tables form (silent). Used by
# `integration_config_dual_mode::loads_mixed_config_with_one_warning`
# to validate per-section deprecation classification: only the legacy
# section emits a warning; the new section parses clean.

[providers.minimax]
endpoint = "https://api.minimax.io/anthropic/v1/messages"
temperature = 0.6

models = [
  { id = "MiniMax-M3" },
]

[[providers.deepseek]]
endpoint = "https://api.deepseek.com/v1/chat/completions"
models = ["deepseek-v4-flash", "deepseek-v4-pro"]
temperature = 0.6