# Fixture: new array-of-tables form with an empty `models = []` entry.
# The dual-mode deserializer accepts this — the bridge turns it into a
# `ProviderEntry` with `models: Vec::new()`, and `Config::default()`
# follows up with the standard "no models = inactive section" semantics.
#
# The companion integration test asserts that the load succeeds (the
# empty entry is not a hard parse error), the section shows up in
# `cfg.providers`, and `cfg.providers_legacy["example"].models` is the
# empty Vec. Operators use this shape to comment out a relay without
# removing the section header — same intent as v0.12's empty legacy
# section.

[[providers.example]]
endpoint = "https://example.com/v1/messages"
models = []