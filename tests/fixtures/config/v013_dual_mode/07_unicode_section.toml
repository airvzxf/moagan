# Fixture: a provider section with non-ASCII characters in its name.
# TOML allows TOML keys to be any Unicode string, and v0.13 inherits
# the keys verbatim — `Config::providers` keys them by the raw string
# the operator wrote. The runtime `MOAGAN_<SECTION>_MAX_TOKENS`
# env-var lookup normalises the section name via
# `.to_uppercase().replace(['.', '-'], "_")` (see
# `src/llm/max_tokens.rs::resolve_max_tokens`), so a non-ASCII
# section like `grèce-1` becomes the env var `MOAGAN_GRÈCE_1_MAX_TOKENS`.
#
# Operators who pick such names MUST keep the encoding consistent
# between the TOML key and the env var; this fixture pins the load
# behaviour so the regression surface is auditable.

[[providers."grèce-1"]]
endpoint = "https://example.com/v1/messages"
models = ["model-a", "model-b"]