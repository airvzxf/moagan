[package]
name = "moagan"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "AGPL-3.0-or-later"
description = "Multi-agent system for technical problems through massive solution exploration, curation, and ranking."
repository = "https://github.com/airvzxf/moagan"
readme = "README.md"

[lib]
name = "moagan"
path = "src/lib.rs"

[[bin]]
name = "moagan"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
toml = "0.8"
uuid = { version = "1.10", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
anyhow = "1"
clap = { version = "4.5", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
rustls = "0.23"
sha2 = "0.10"
blake3 = "1.5"
hex = "0.4"
regex = "1.10"
once_cell = "1.19"
parking_lot = "0.12"
dashmap = "6.1"
rusqlite = { version = "0.31", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.24"
walkdir = "2.5"
flate2 = "1.0"
tar = "0.4"
zip = "2.2"
zstd = "0.13"
indicatif = "0.17"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
dotenvy = "0.15"
dialoguer = { version = "0.11", default-features = false }
rayon = "1.10"
fastrand = "2.0"
memchr = "2.7"
directories = "5.0"
async-trait = "0.1"
futures = "0.3"
jsonschema = { version = "0.17", default-features = false }
zeroize = "1.7"
tiktoken-rs = "0.5"

[dev-dependencies]
tempfile = "3.10"
assert_fs = "1.1"
predicates = "3.1"
wiremock = "0.6"
insta = { version = "1.39", features = ["yaml"] }
assert_cmd = "2"
