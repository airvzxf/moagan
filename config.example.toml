# Example user-level config for `moagan` (v0.13 schema).
#
# This file is documentation. `moagan` does NOT read it; copies of it live at
# `~/.config/moagan/config.toml` (the XDG-compliant home for moagan).
# To activate any settings here, copy this file to the path above and edit.
#
# v0.13+ uses the `[[providers.<name>]]` array-of-tables shape. A v0.12
# legacy `[providers.<name>]` single-table config STILL loads with a
# `tracing::warn!` per legacy section (the dual-mode deserializer in
# `src/config/dual_mode.rs` accepts both). Legacy support is scheduled
# for removal in v0.15 — see:
#
#   docs/adr/0003-config-schema-array-of-tables.md
#   docs/migrations/v0.12-to-v0.13-config.md
#
# A commented-out LEGACY block at the bottom shows the v0.12 syntax
# side-by-side with the new shape; the `--> MIGRATE` arrow marks the
# conversion point.

[circuit_breaker]
# Threshold for tripping the breaker per provider, inside `window_secs`.
# Default is 5; 200 tolerates upstream noise on the MiniMax-M3 wire.
threshold = 200

# Sliding window for failure counting, in seconds. Default 60 s;
# 600 s gives the breaker a wider memory of recent errors.
window_secs = 600

# Time the breaker stays open before transitioning to HalfOpen. Default
# 30 s; 180 s when running multiple discovery tests in succession.
cooldown_secs = 180

# Per-role rate-limit override (catalog §D.19.6). Key is the
# `Role::as_str()` value (snake_case: "tagger", "facet_deriver", …).
# Empty by default = only the per-provider bucket applies.
#
# [rate_limit_per_role]
# tagger = { capacity = 30, refill_per_sec = 2 }

# ---------------------------------------------------------------------------
# v0.13 provider schema
# ---------------------------------------------------------------------------
#
# Each `[[providers.<name>]]` entry binds one upstream endpoint to a set
# of model ids. A single-endpoint provider (minimax, deepseek, mock) is
# one entry; opencode fronts three wire formats and is three entries
# under the same section roof. The wire format (`/v1/messages`,
# `/v1/chat/completions`, `/v1/responses`) is read from the URL path by
# the dispatcher; the section name is the canonical key for
# `api_keys.toml` and the `<NAME>_API_KEY` env-var fallback.
#
# Section-level knobs (`temperature`, `top_p`, `omit_max_tokens`,
# `max_token_auto*`, `temperature_auto_enabled`, `plan`) can appear on
# any entry. The bridge (`Config::compute_legacy_providers`) merges
# them with `SectionKnobs::merge_first_wins` when collapsing into the
# canonical `ProviderConfig` shape, so the operator can spread knobs
# across entries or keep them on the first one — both forms parse
# identically.
#
# DO NOT put real API keys here — use `~/.config/moagan/api_keys.toml`.

# [defaults]
# provider = "opencode:kimi-k3"

# [[providers.minimax]]
# endpoint = "https://api.minimax.io/anthropic/v1/messages"
# models = [
#   "MiniMax-M3",
#   "MiniMax-M2.7",
#   "MiniMax-M2.7-highspeed",
#   "MiniMax-M2.5",
# ]
# temperature = 0.6
# top_p = 0.95
# max_token_auto = 1024      # auto-probe floor; runtime discovers above this

# [[providers.deepseek]]
# endpoint = "https://api.deepseek.com/v1/chat/completions"
# models = [
#   "deepseek-v4-flash",
#   "deepseek-v4-flash-vision-exp",
#   "deepseek-v4-pro",
#   "deepseek-chat",
#   "deepseek-reasoner",
# ]
# temperature = 0.6
# top_p = 0.95

# [[providers.opencode]]
# endpoint = "https://opencode.ai/zen/go/v1/chat/completions"
# models = ["kimi-k3", "kimi-k2.6", "glm-5.1", "glm-5.2", "glm-5.3-flash",
#           "deepseek-v4-pro", "deepseek-v4-flash", "mimo-v2.5", "mimo-v2.5-pro", "hy3"]
# temperature = 1.0
# top_p = 0.95
#
# [[providers.opencode]]
# endpoint = "https://opencode.ai/zen/go/v1/messages"
# models = ["minimax-m3", "minimax-m2.7", "minimax-m2.5",
#           "qwen3.8-max", "qwen3.7-max", "qwen3.7-plus", "qwen3.6-plus"]
#
# [[providers.opencode]]
# endpoint = "https://opencode.ai/zen/go/v1/responses"
# models = ["gpt-5.6-luna", "muse-spark-1.2-contributor"]
# omit_max_tokens = true   # gpt-5.6-luna rejects the *presence* of `max_tokens`

# [[providers.mock]]
# endpoint = "mock://local"
# models = ["mock-model"]

# ---------------------------------------------------------------------------
# v0.12 LEGACY schema (DEPRECATED, supported until v0.15)
# ---------------------------------------------------------------------------
# The dual-mode deserializer accepts this single-table form and emits a
# `tracing::warn!` per legacy section. Conversion is mechanical — see
# the `--> MIGRATE` notes below. This form will be REMOVED in v0.15.
#
# [providers.minimax]                                        --> MIGRATE
# endpoint = "https://api.minimax.io/anthropic/v1/messages"
# temperature = 0.6
# top_p = 0.95
# models = [
#   { id = "MiniMax-M3" },               # --> replace with "MiniMax-M3",
#   { id = "MiniMax-M2.7" },             # --> "MiniMax-M2.7",
#   { id = "MiniMax-M2.7-highspeed" },   # --> "MiniMax-M2.7-highspeed",
#   { id = "MiniMax-M2.5" },             # --> "MiniMax-M2.5",
# ]
#
# Per-model `max_tokens = N` is gone in v0.13; set
# `MOAGAN_MINIMAX_MAX_TOKENS=N` instead — see §4 of the migration guide.
#
# [providers.opencode]                                       --> MIGRATE
# models = [
#   { id = "kimi-k3", endpoint = "https://opencode.ai/zen/go/v1/chat/completions" },
#   ...
# ]
#
# becomes:
#
# [[providers.opencode]]                                     --> MIGRATE
# endpoint = "https://opencode.ai/zen/go/v1/chat/completions"
# models = ["kimi-k3", ...]
#
# [[providers.opencode]]                                     --> MIGRATE
# endpoint = "https://opencode.ai/zen/go/v1/messages"
# models = [...]
#
# [[providers.opencode]]                                     --> MIGRATE
# endpoint = "https://opencode.ai/zen/go/v1/responses"
# models = [...]
# omit_max_tokens = true