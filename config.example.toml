# Example user-level config for `moagan` (v0.18+ schema).
#
# This file is documentation. `moagan` does NOT read it; copies of it live at
# `~/.config/moagan/config.toml` (the XDG-compliant home for moagan).
# To activate any settings here, copy this file to the path above and edit.
#
# v0.13+ uses the `[[providers.<name>]]` array-of-tables shape. The
# v0.12 legacy `[providers.<name>]` single-table form was removed
# in v0.13.1 — see:
#
#   docs/adr/0003-config-schema-array-of-tables.md
#   docs/adr/0004-accelerate-legacy-config-removal.md

[circuit_breaker]
# Threshold for tripping the breaker per provider, inside `window_secs`.
# Default is 5; 200 tolerates upstream noise on the MiniMax-M3 wire.
threshold = 200

# Sliding window for failure counting, in seconds. Default 60 s;
# 600 s gives the breaker a wider memory of recent errors.
window_secs = 600

# Time the breaker stays open before transitioning to HalfOpen. Default
# 30 s; 180 s when running multiple discovery tests in succession.
cooldown_secs = 180

# Per-role rate-limit override (catalog §D.19.6). Key is the
# `Role::as_str()` value (snake_case: "tagger", "facet_deriver", …).
# Empty by default = only the per-provider bucket applies.
#
# [rate_limit_per_role]
# tagger = { capacity = 30, refill_per_sec = 2 }

# ---------------------------------------------------------------------------
# v0.18 LlmClient schema (EPIC #847)
# ---------------------------------------------------------------------------
#
# Each `[[providers.<name>]]` entry binds one upstream endpoint to a set
# of model ids. A single-endpoint provider (minimax, deepseek, mock) is
# one entry; opencode fronts three wire formats and is three entries
# under the same section roof. The wire format is read from the URL path
# by `crate::llm::client::dispatcher::pick_sdk` and dispatches to one
# of the three SDK impls (`AnthropicClient`, `OpenAIClient`,
# `MockClient`) — see ADR-0012.
#
# Wire format routing (PR EPIC #847, D2):
#   /v1/messages         → AnthropicClient (sdk_type = "anthropic")
#   /v1/chat/completions → OpenAIClient   (sdk_type = "openai_compatible")
#   /v1/responses        → OpenAIClient   (sdk_type = "openai")
#   mock://              → MockClient     (sdk_type = "mock")
# The dispatcher picks the SDK impl from the URL path suffix;
# no `sdk = "..."` knob is exposed.
#
# Section-level knobs (`temperature`, `top_p`, `omit_max_tokens`,
# `max_token_auto*`, `temperature_auto_enabled`, `top_p_auto_enabled`,
# `top_k_auto_enabled`, `plan`) can appear on any entry; when multiple
# entries exist, knobs on the first entry win for unset slots on later
# entries.
#
# DO NOT put real API keys here — use `~/.config/moagan/api_keys.toml`.
# The `MOAGAN_<NAME>_OMIT_<OLD>` env vars removed in v0.18 (D3)
# are no longer consulted; use the section-level `omit_max_tokens`
# boolean on the affected model instead.

# default_provider = "opencode:kimi-k3"

# [[providers.minimax]]
# endpoint = "https://api.minimax.io/anthropic/v1/messages"
# models = [
#   "MiniMax-M3",
#   "MiniMax-M2.7",
#   "MiniMax-M2.7-highspeed",
#   "MiniMax-M2.5",
# ]
# temperature = 0.6
# top_p = 0.95
# max_token_auto = 1024      # auto-probe floor; runtime discovers above this
# top_p_auto_enabled = true  # probe + persist top_p support set (per D7)
# top_k_auto_enabled = true  # probe + persist top_k support set

# [[providers.deepseek]]
# endpoint = "https://api.deepseek.com/v1/chat/completions"
# models = [
#   "deepseek-v4-flash",
#   "deepseek-v4-flash-vision-exp",
#   "deepseek-v4-pro",
#   "deepseek-chat",
#   "deepseek-reasoner",
# ]
# temperature = 0.6
# top_p = 0.95

# [[providers.opencode]]
# endpoint = "https://opencode.ai/zen/go/v1/chat/completions"
# models = ["kimi-k3", "kimi-k2.6", "glm-5.1", "glm-5.2", "glm-5.3-flash",
#           "deepseek-v4-pro", "deepseek-v4-flash", "mimo-v2.5", "mimo-v2.5-pro", "hy3"]
# temperature = 1.0
# top_p = 0.95
#
# [[providers.opencode]]
# endpoint = "https://opencode.ai/zen/go/v1/messages"
# models = ["minimax-m3", "minimax-m2.7", "minimax-m2.5",
#           "qwen3.8-max", "qwen3.7-max", "qwen3.7-plus", "qwen3.6-plus"]
#
# [[providers.opencode]]
# endpoint = "https://opencode.ai/zen/go/v1/responses"
# models = ["gpt-5.6-luna", "muse-spark-1.2-contributor"]
# omit_max_tokens = true   # gpt-5.6-luna rejects the *presence* of `max_tokens`

# [[providers.mock]]
# endpoint = "mock://local"
# models = ["mock-model"]
# omit_max_tokens = true

# ---------------------------------------------------------------------------
# Operator-side cost overrides (closes #965)
# ---------------------------------------------------------------------------
#
# When a provider / model is missing from `https://models.dev/api.json`,
# `cost_estimate` silently returns $0.00 and dashboards that sum
# `cost_usd > 0` cannot see the real spend. To fix this without waiting
# for the upstream to ship the row, hand-author a pricing table at the
# matching path:
#
#   <MOAGAN_HOME>/cost_overrides.toml    (default: ~/.local/share/moagan/)
#
# Schema (v1, dotted-table form — same `provider -> { model -> Cost }`
# shape the upstream catalog uses). Every field is USD per MILLION tokens.
# The estimator consults the override BEFORE the catalog so an operator
# who disagrees with the upstream row can always win.
#
# NOTE: pricing is an operator decision, not a wire-detectable fact, so
# this file is read-only at runtime — the binary never rewrites it.
# Mirror the sidecar pattern used by `max_tokens_auto.toml` /
# `temperatures_auto.toml` / `top_p_auto.toml` / `top_k_auto.toml`
# for consistency.
#
# Example (real MiniMax-M3 family rates as of v0.18.1):
#
# schema_version = 1
#
# [cost_overrides.minimax."MiniMax-M3"]
# input       = 0.30
# output      = 1.20
# cache_read  = 0.06
# cache_write = 0.375
#
# [cost_overrides.minimax."MiniMax-M2.7"]
# input       = 0.30
# output      = 1.20
# cache_read  = 0.03
# cache_write = 0.375
#
# [cost_overrides.minimax."MiniMax-M2.7-highspeed"]
# input       = 0.60
# output      = 2.40
# cache_read  = 0.03
# cache_write = 0.375
#
# [cost_overrides.minimax."MiniMax-M2.5"]
# input       = 0.30
# output      = 1.20
# cache_read  = 0.03
# cache_write = 0.375
#
# Any pair NOT listed here still falls through to the catalog and then
# to $0.00 — the file is purely additive. To delete an upstream rate
# the operator disagrees with, set its fields to zero (the cost
# estimator will then return $0.00 for that pair explicitly).
