# Example user-level config for `moagan` (v0.10 schema).
#
# This file is documentation. `moagan` does NOT read it; copies of it live at
# `~/.config/moagan/config.toml` (the XDG-compliant home for moagan).
# To activate any settings here, copy this file to the path above and edit.
#
# When `MoaganHome::resolve()` boots, it merges the on-disk TOML with the
# `#[serde(default)]` `Default` impls in `src/config/mod.rs`. Every field has
# a default, so you can omit any section and get the in-code default.

[circuit_breaker]
# Threshold for tripping the breaker per provider, inside `window_secs`.
# Default is 5, which is too tight for long discovery fan-outs (50 errors
# in 5 min is easy to hit on flaky upstreams). 200 is the recommended
# value to tolerate upstream noise on the MiniMax-M3 wire (`anthropic`).
# Override per-provider if needed.
threshold = 200

# Sliding window for failure counting, in seconds.
# Default is 60 s; 600 s gives the breaker a wider memory of recent errors.
window_secs = 600

# Time the breaker stays open before transitioning to HalfOpen. After
# cooldown, the next call is a probe; success closes, failure re-opens.
# Default is 30 s; 180 s is the recommended value when running multiple
# discovery tests in succession.
cooldown_secs = 180

# See `src/config/mod.rs` CircuitBreakerConfig for the full schema; this
# file only documents the fields most operators want to override.

# Per-role rate-limit override (catalog §D.19.6). Key is the
# `Role::as_str()` value (snake_case: "tagger", "facet_deriver",
# "extractor", etc.). Empty by default = only the per-provider bucket
# applies. Use this when the upstream provider has a tighter quota for
# one role (e.g. tagger fan-out of 1500+ calls after the post-matrix
# stages).
#
# [rate_limit_per_role]
# tagger = { capacity = 30, refill_per_sec = 2 }

# ---------------------------------------------------------------------------
# v0.10 provider schema
# ---------------------------------------------------------------------------
#
# Each `[providers.<section>]` section groups every model that shares the
# same upstream relay. The wire format (`/v1/messages`,
# `/v1/chat/completions`, `/v1/responses`) is detected from the
# per-model URL by the dispatcher; the section name is the canonical
# key for `api_keys.toml` and the `<NAME>_API_KEY` env-var fallback.
#
# DO NOT put real API keys here — use `~/.config/moagan/api_keys.toml`
# or the `MOAGAN_DEFAULT_PROVIDER` env var.

# [defaults]
# provider = "opencode:kimi-k3"

# [providers.minimax]
# endpoint = "https://api.minimax.io/anthropic/v1/messages"
# models = [
#   { id = "MiniMax-M3",            max_tokens = 1000000 },
